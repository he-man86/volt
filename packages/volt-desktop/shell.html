<!doctype html>
<meta charset="utf-8" />
<title>Volt</title>
<style>
  /* Volt shell chrome. The IDE panel IS the window — it fills everything left of a thin icon rail, which acts as
     a section navigator (VS Code activity-bar style) rather than a show/hide toggle. Tokens follow the OS
     light/dark preference. Light = the branded www.volt palette (warm off-white, #e0651f accent); dark = the
     warm-dark counterpart. */
  :root {
    /* warm DARK (default) */
    --bg: #16120e; --surface: #201a14; --chrome: #2a2219; --border: #342b20;
    --text: #f3ead9; --muted: #9a8e7c; --accent: #f2843c; --accent-hi: #ff9a52; --on-accent: #16120e;
    --red: #e8675c; --green: #74c07a; --amber: #f2b24c;
    --hover: color-mix(in srgb, var(--text) 8%, transparent);
    --hover-strong: color-mix(in srgb, var(--text) 13%, transparent);
    --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
    --rail-w: 46px;
    --r-sm: 5px; --r-md: 7px; --r-lg: 9px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      /* warm LIGHT — the branded website palette */
      --bg: #fff9f1; --surface: #f4ede2; --chrome: #ebe2d4; --border: #e2d8c8;
      --text: #1a1714; --muted: #6e665b; --accent: #e0651f; --accent-hi: #b8521a; --on-accent: #fff9f1;
      --red: #cc4b37; --green: #3e9b52; --amber: #e08a2b;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; color: var(--text); background: var(--bg); user-select: none; overflow: hidden;
    font: 13px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .bolt { width: 15px; height: 15px; color: var(--accent); flex: none; }
  .ico { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ico.spin { animation: spin .8s linear infinite; transform-origin: center; }
  .ico--muted { color: var(--muted); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .titlebar { position: relative; height: 40px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px 0 14px; background: var(--chrome); border-bottom: 1px solid var(--border); -webkit-app-region: drag; }
  /* Always-visible action progress — lives in the titlebar so a running pull/push/build/init is visible from any
     section. Same `busy`/onProgress feed as the panel note; the 2px `tbar` is the determinate fill (indeterminate
     ops just spin the icon). */
  .progress { display: none; align-items: center; gap: 7px; margin: 0 auto 0 16px; min-width: 0;
    color: var(--muted); font-size: 12px; font-weight: 550; font-variant-numeric: tabular-nums; }
  .progress.on { display: flex; }
  .progress .ico { width: 13px; height: 13px; color: var(--accent); }
  .progress .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The RESULT frame (connect/disconnect end here instead of in a modal): no spinner, and an error reads red. */
  .progress.done .ico { display: none; }
  .progress.done .msg { color: var(--text); }
  .progress.done.err .msg { color: var(--red); }
  .tbar { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent);
    transition: width 160ms ease; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 640; letter-spacing: -0.01em; }
  .winctl { display: flex; gap: 2px; -webkit-app-region: no-drag; }
  .winctl button { width: 34px; height: 26px; border: 0; background: transparent; color: var(--muted);
    border-radius: var(--r-sm); display: grid; place-items: center; cursor: default; font-size: 13px;
    transition: background 140ms ease, color 140ms ease; }
  .winctl button:hover { background: var(--hover); color: var(--text); }
  .winctl .close:hover { background: var(--red); color: #fff; }

  /* the always-visible icon rail */
  #rail { position: fixed; top: 40px; right: 0; bottom: 0; width: var(--rail-w); background: var(--chrome);
    border-left: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; }
  .rail-btn { position: relative; width: 38px; height: 38px; border: 0; background: transparent; color: var(--muted);
    border-radius: var(--r-lg); display: grid; place-items: center; cursor: default;
    transition: background 140ms ease, color 140ms ease; }
  .rail-btn:hover { background: var(--hover); color: var(--text); }
  .rail-btn.on { background: var(--accent-soft); color: var(--accent); }
  .rail-btn .bolt, .rail-btn .ico { width: 19px; height: 19px; }
  .rail-badge { position: absolute; top: 0; right: 0; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 700; line-height: 15px; text-align: center;
    box-shadow: 0 0 0 2px var(--chrome); }
  .rail-badge.err { background: var(--red); color: #fff; }
  .rail-badge.warn { background: var(--amber); color: var(--on-accent); }
  .rail-badge.hide { display: none; }
  /* Bridge tab: a corner status dot (health tone) instead of a count. */
  .rail-status { position: absolute; bottom: 2px; right: 2px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted); box-shadow: 0 0 0 2px var(--chrome); }
  .rail-status.ok { background: var(--green); } .rail-status.warn { background: var(--amber); } .rail-status.error { background: var(--red); }

  /* The panel — the window's content, not a drawer. It fills everything left of the rail; the sections stay in a
     readable column rather than stretching to the full width of a resized window. */
  #panel { position: fixed; top: 40px; left: 0; right: var(--rail-w); bottom: 0;
    background: var(--bg); overflow-y: auto; }
  #panel .inner { max-width: 640px; margin: 0 auto; padding-bottom: 28px; }
  #panel::-webkit-scrollbar { width: 9px; }
  #panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }

  .sect { display: flex; align-items: center; gap: 7px; padding: 14px 10px 5px 14px; scroll-margin-top: 4px; }
  .sect .s-title { font-size: 10px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--muted); }
  .sect + .sect { border-top: 1px solid var(--border); margin-top: 7px; }
  /* Collapsible section header — the chevron + title toggle the body; the action row stays a sibling. */
  .s-head { -webkit-app-region: no-drag; flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; border: 0;
    background: transparent; padding: 0; margin: 0; cursor: default; text-align: left; }
  .s-head:hover .s-title { color: var(--text); }
  .chev { width: 11px; height: 11px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2.5; stroke-linecap: round;
    stroke-linejoin: round; transition: transform 140ms ease; }
  .chev.open { transform: rotate(90deg); }
  .s-acts { margin-left: auto; display: flex; gap: 2px; }
  .ico-btn { width: 26px; height: 24px; border: 0; background: transparent; color: var(--muted); border-radius: var(--r-sm);
    display: grid; place-items: center; cursor: default; transition: background 140ms ease, color 140ms ease; }
  .ico-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .ico-btn:disabled { opacity: .3; }
  /* Overflow "⋯" menu — the destructive force actions live here, out of the primary row (matches VS Code's More
     Actions submenu). Anchored to its button; `moreOpen` state toggles .open, an outside click closes it. */
  .more-btn { font-size: 15px; line-height: 1; }
  .more { position: relative; display: flex; }
  .menu { position: absolute; top: 100%; right: 0; margin-top: 4px; z-index: 20; min-width: 230px; padding: 4px;
    background: var(--chrome); border: 1px solid var(--border); border-radius: var(--r-md);
    box-shadow: 0 8px 24px rgba(0,0,0,.35); display: none; flex-direction: column; }
  .menu.open { display: flex; }
  .menu button { -webkit-app-region: no-drag; text-align: left; border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 12px; padding: 7px 9px; border-radius: var(--r-sm); cursor: default; white-space: nowrap; }
  .menu button:hover { background: var(--hover); }
  /* The change list gets its OWN scroll box so a long incoming/outgoing list scrolls within the section instead of
     growing the whole panel (matches VS Code's per-view scrolling). */
  .scroll { max-height: 46vh; overflow-y: auto; }
  .scroll::-webkit-scrollbar { width: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }

  .grp { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; font-weight: 600; padding: 8px 14px 3px; }
  .grp .n { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 500; }
  .row { display: flex; align-items: center; gap: 8px; padding: 3px 14px; font-size: 12.5px; }
  .row .stat { font-family: ui-monospace, "JetBrains Mono", monospace; font-weight: 700; width: 12px; text-align: center; flex: none; }
  .stat.A { color: var(--green); } .stat.M { color: var(--amber); } .stat.D { color: var(--red); }
  .row.click { cursor: default; border-radius: var(--r-sm); }
  .row.click:hover { background: var(--hover); }
  /* Merge conflict rows: the name opens the diff, the mini buttons take a whole side (IDE / Mine). */
  .row .path.click { cursor: default; }
  .row .path.click:hover { text-decoration: underline; }
  .mini { -webkit-app-region: no-drag; border: 1px solid var(--border); background: transparent; color: var(--muted);
    font: inherit; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: var(--r-sm); cursor: default; white-space: nowrap; }
  .mini:hover { background: var(--hover); color: var(--text); }
  .row .path { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .n { margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; padding-left: 8px; font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); padding: 5px 14px 7px; font-size: 12.5px; line-height: 1.5; display: flex; gap: 7px; align-items: flex-start; }
  .note .bolt, .note .ico { margin-top: 1px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--green); } .dot.warn { background: var(--amber); } .dot.error { background: var(--red); }
  .init-row { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px 12px; }

  /* Buttons — flat, confident, native (no web-CTA outline). Primary = accent fill; secondary = quiet tint. */
  .btn { -webkit-app-region: no-drag; display: flex; align-items: center; justify-content: center; gap: 7px;
    background: var(--hover); color: var(--text); border: 1px solid transparent; border-radius: var(--r-md);
    padding: 9px 13px; font: inherit; font-size: 12.5px; font-weight: 550; cursor: default;
    transition: background 140ms ease, transform 120ms ease; }
  .btn:hover { background: var(--hover-strong); }
  .btn:active { transform: translateY(0.5px); }
  .btn .bolt { color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 640; }
  .btn.primary:hover { background: var(--accent-hi); }
  .btn.primary .bolt { color: var(--on-accent); }
  .btn:disabled { opacity: .38; pointer-events: none; } /* in-flight (spinner) or no live IDE — visible but inert */
  /* The panel's primary action (create a workspace / reconnect) — sized up so it reads as the thing to do, not a
     list item. Secondary actions (rebind alternates) stay at the default size outside `.cta`. */
  .cta .grp { font-size: 13px; color: var(--text); padding-top: 12px; }
  .cta .btn { padding: 12px 14px; font-size: 13.5px; }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2 4.5 13.2c-.5.66-.03 1.6.8 1.6H11l-1.4 7.2c-.16.85.94 1.34 1.47.66L20 11.4c.5-.66.03-1.6-.8-1.6H13.5L14.6 2.9c.14-.83-.93-1.32-1.46-.66Z" fill="currentColor"/></symbol>
  <symbol id="i-pull" viewBox="0 0 24 24"><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4M12 3v11m0 0 4-4m-4 4-4-4"/></symbol>
  <symbol id="i-push" viewBox="0 0 24 24"><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4M12 15V4m0 0 4 4m-4-4-4 4"/></symbol>
  <symbol id="i-build" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v5h-5"/></symbol>
  <symbol id="i-connect" viewBox="0 0 24 24"><path d="M9 7H7a5 5 0 0 0 0 10h2M15 7h2a5 5 0 0 1 0 10h-2M8 12h8"/></symbol>
  <symbol id="i-disconnect" viewBox="0 0 24 24"><path d="M9 7H7a5 5 0 0 0 0 10h2M15 17h2a5 5 0 0 0 0-10h-2M2 2l20 20"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-bridge" viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 0 1 0 10h-2M8 12h8"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h3.6a1 1 0 0 1 .7.3L11 7h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
</svg>

<div class="titlebar">
  <span class="brand"><svg class="bolt"><use href="#bolt"/></svg>Volt</span>
  <span class="progress" id="progress"><svg class="ico spin"><use href="#i-refresh"/></svg><span class="msg" id="progressMsg"></span></span>
  <span class="winctl">
    <button onclick="volt.minimize()" aria-label="Minimize">&#x2013;</button>
    <button onclick="volt.maximize()" aria-label="Maximize">&#x25a1;</button>
    <button class="close" onclick="volt.close()" aria-label="Close">&#x2715;</button>
  </span>
  <span class="tbar" id="tbar"></span>
</div>

<nav id="rail">
  <button class="rail-btn" id="railBridge" title="IDE Connection" onclick="tab('bridge')">
    <svg class="ico"><use href="#i-bridge"/></svg><span class="rail-status" id="bridgeStatus"></span>
  </button>
  <button class="rail-btn" id="railSync" title="IDE changes" onclick="tab('sync')">
    <svg class="bolt"><use href="#bolt"/></svg><span class="rail-badge hide" id="driftBadge">0</span>
  </button>
  <button class="rail-btn" id="railDiag" title="Diagnostics" onclick="tab('diag')">
    <svg class="ico"><use href="#i-alert"/></svg><span class="rail-badge err hide" id="diagBadge">0</span>
  </button>
</nav>

<aside id="panel"></aside>

<script>
  let snap = { bound: false, awaiting: true, initialized: false, paused: null, incoming: [], outgoing: [], surface: { kind: "create", create: [], primary: [], alternates: [] } }
  let diag = null // { loading } | { errors, warnings, files } | { error }
  // Which rail tab is lit + scrolled to. Defaults to the connection: it's the first thing to set up, and the first
  // thing to check when sync stops. Every section is always rendered — the rail navigates, it doesn't show/hide.
  let activeTab = "bridge"
  let busy = null // live progress text for the in-flight action (pull/push/build/connect/init), else null
  let busyAction = null // WHICH action is in flight ("pull"/"connect"/"rebind:<id>"/…) — spins THAT button until done
  let busyPct = null // determinate % for the titlebar bar (null = indeterminate — just spin the icon)
  let busyTone = null // set only by a RESULT frame ("info"/"error") — the finished-action styling; null while running
  let moreOpen = false // the sync section's "⋯" overflow menu (force pull/push)
  let refreshing = false // status refresh in flight — spins the refresh icon; cleared when the fresh status arrives
  const collapsed = new Set() // section keys the user collapsed (click a header to fold its body away, VS Code-style)

  // Escapes ' as well as the usual four: project names come from the IDE and land inside a single-quoted JS
  // string in an onclick (doInit('<id>')), so a project called "Bob's Machine" would otherwise close the literal
  // and leave the button a syntax error that silently does nothing — with the id being attacker-influencable
  // markup on top of that.
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))
  const base = (p) => p.split(/[\\/]/).pop()
  // Change rows are clickable → open a diff popup. Data rides on data-* attrs (esc-safe) and a single delegated
  // listener on #panel reads them, so no user text lands in an onclick and the handler survives re-renders.
  const changeRows = (items, dir, root) => items.map((f) => `<div class="row click" data-root="${esc(root)}" data-path="${esc(f.relPath)}" data-name="${esc(f.name)}" data-dir="${dir}" title="Open diff"><span class="stat ${f.sub}">${f.sub}</span><span class="path">${esc(f.name)}</span></div>`).join("")
  const changeGrp = (label, items, dir, root) => items.length ? `<div class="grp">${label}<span class="n">${items.length}</span></div>${changeRows(items, dir, root)}` : ""
  // In-button feedback: the acting button shows a spinner + goes inert until its action finishes (busyAction clears).
  // This — not a popup — is how every action reports "working…". `key` names the action (matches begin()'s key).
  const spinIco = `<svg class="ico spin"><use href="#i-refresh"/></svg>`
  const icoBtn = (icon, title, onclick, key) => {
    const p = key != null && busyAction === key
    return `<button class="ico-btn" title="${p ? "Working…" : title}" ${p ? "disabled" : ""} onclick="${p ? "" : onclick}">${p ? spinIco : `<svg class="ico"><use href="#${icon}"/></svg>`}</button>`
  }
  // A text/label button (Connect, Disconnect, Finish/Abort merge, a project row) with the same in-button spinner.
  const btn = (key, cls, onclick, iconHtml, label, title) => {
    const p = busyAction === key
    return `<button class="${cls}" title="${title}" ${p ? "disabled" : ""} onclick="${p ? "" : onclick}">${p ? spinIco : iconHtml}${label}</button>`
  }
  // The refresh action, spinning + disabled while a refresh is in flight (both the Sync and Bridge sections use it).
  const refreshBtn = (title) => refreshing
    ? `<button class="ico-btn" title="Refreshing…" disabled><svg class="ico spin"><use href="#i-refresh"/></svg></button>`
    : icoBtn("i-refresh", title, "doRefresh()")
  // A collapsible section: click the header (chevron + title) to fold its body away; the action buttons live in a
  // sibling `.s-acts` so they still work while the header toggles. Collapsed → the body isn't rendered at all.
  const section = (key, title, acts, body) => {
    const open = !collapsed.has(key)
    return `<div class="sect" id="sect-${key}"><button class="s-head" title="${open ? "Collapse" : "Expand"}" onclick="toggleSect('${key}')"><svg class="chev${open ? " open" : ""}" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg><span class="s-title">${title}</span></button><span class="s-acts">${acts}</span></div>${open ? body : ""}`
  }

  // A detected-project button in the connection picker. Its `action` (from @volt/control's connectOptions) decides
  // the click + hint: init = first-time set up · connect = reconnect the matching project · rebind = re-point the
  // binding at a DIFFERENT project (a rename), confirmed first. Inline call args are esc-safe (esc escapes quotes).
  const projectBtn = (p) => {
    const key = p.action === "connect" ? "connect" : `${p.action}:${p.id}` // "connect" | "rebind:<id>" | "init:<id>"
    // The project NAME is the identity — the UI is vendor-blind, so no "CODESYS · " prefix or badge (the vendor is a
    // wire/binding detail, never a way to label a project here).
    const label = `${esc(p.displayName)}${p.dirty ? " *" : ""}`
    const click = p.action === "connect" ? "doConnect()" : p.action === "rebind" ? `doRebind('${esc(p.id)}','${esc(p.displayName)}')` : `doInit('${esc(p.id)}')`
    const title = p.action === "connect"
      ? "Reconnect this workspace to the IDE."
      : p.action === "rebind"
        ? "Bind this workspace to this project instead (e.g. after a rename in the IDE) — asks to confirm first."
        : "Creates the git workspace and pulls the project's code — the IDE is not modified."
    // init/connect are the primary move on their screen (accent fill); rebind stays quiet — it's a correction.
    return btn(key, p.action === "rebind" ? "btn" : "btn primary", click, `<svg class="bolt"><use href="#bolt"/></svg>`, label, title)
  }
  const projectList = (projects) => `<div class="init-row">` + projects.map(projectBtn).join("") + `</div>`
  // The two connection surfaces. The GROUPING is @volt/control's (snapshot passes s.surface already partitioned +
  // ordered — create vs reconnect, matching project first); the shell only draws it + supplies copy, never re-decides
  // which project is primary. CREATE (unbound folder): the outcome is named up front so "pick a project" reads as
  // "make a new workspace". RECONNECT (bound, offline): the matching project first, others demoted to rebind.
  const createSurface = (surface) =>
    `<div class="cta"><div class="grp">Create a Volt workspace</div>` +
    `<div class="note">Pick the open IDE project to create a new synced folder + git repo from — your IDE isn't modified.</div>` +
    projectList(surface.create) + `</div>`
  // Same shape as createSurface — one named heading, one prominent CTA — so the in-project screen reads like the
  // home one. `.cta` sizes up the primary action only; the rebind alternates stay quiet below it.
  const reconnectSurface = (surface) => {
    if (!surface.primary.length)
      // This workspace's own project isn't open — only others are, offered as rebind targets.
      return `<div class="grp">Bind to a different project</div>` +
        `<div class="note">This workspace's project isn't detected. Open it in the IDE to reconnect, or bind to one of these instead.</div>` +
        projectList(surface.alternates)
    return `<div class="cta"><div class="grp">Reconnect</div>` +
      `<div class="note">Resume syncing with this project — your IDE isn't modified.</div>` +
      projectList(surface.primary) + `</div>` +
      (surface.alternates.length ? `<div class="grp">Bind to a different project instead</div>` + projectList(surface.alternates) : "")
  }

  function renderRail() {
    // Sync tab — count of pending changes, but ONLY while actually syncing (`ready`). Offline, incoming/outgoing
    // are last-known/stale (we can't compare against a bridge that's down) and the Sync body says "not connected",
    // so a live-looking count on the rail contradicted it.
    const n = snap.mode === "ready" ? snap.incoming.length + snap.outgoing.length : 0
    const drift = document.getElementById("driftBadge")
    drift.textContent = n
    drift.classList.toggle("hide", n === 0)
    // Diagnostics tab — red count of errors, else amber count of warnings, else nothing. Gate on `initialized`:
    // `diag` lingers from a previous project after switching to a non-Volt folder, so don't badge it there.
    const d = snap.initialized && diag && !diag.loading && !diag.error ? diag : null
    const db = document.getElementById("diagBadge")
    if (d && d.errors > 0) db.className = "rail-badge err", (db.textContent = d.errors)
    else if (d && d.warnings > 0) db.className = "rail-badge warn", (db.textContent = d.warnings)
    else db.className = "rail-badge err hide"
    // IDE Connection tab — a corner status dot in the health tone (ok / warn / error).
    document.getElementById("bridgeStatus").className = "rail-status" + (snap.initialized && snap.health ? " " + snap.health.tone : "")
    // Active-tab highlight (VS Code activity-bar style): the section last navigated to is lit.
    for (const [t, id] of [["bridge", "railBridge"], ["sync", "railSync"], ["diag", "railDiag"]])
      document.getElementById(id).classList.toggle("on", activeTab === t)
  }

  // The titlebar progress — updated on EVERY render (before the panel early-return), so an action is visible even
  // with the panel closed. Empties out when `busy` clears (runGuarded sends a null progress frame on completion).
  function renderProgress() {
    const el = document.getElementById("progress")
    el.classList.toggle("on", busy != null)
    el.classList.toggle("done", busyTone != null) // a finished action's result, not a running one
    el.classList.toggle("err", busyTone === "error")
    document.getElementById("progressMsg").textContent = busy || ""
    document.getElementById("tbar").style.width = busy != null && busyPct != null ? busyPct + "%" : "0"
  }

  function render() {
    renderProgress()
    renderRail()
    const s = snap
    const n = s.incoming.length + s.outgoing.length

    // One live-progress note, shown above the acting section's body (formatProgress feeds `busy`).
    const busyNote = busy ? `<div class="note"><svg class="bolt"><use href="#bolt"/></svg>${esc(busy)}</div>` : ""

    // 1. IDE Connection — the WHOLE connection lifecycle: which project, set up, connect, disconnect. It leads the
    // panel because it's the first thing a new user must do and the first thing to check when sync stops. IDE Sync
    // below is only "what changed" — it never owns connecting (that split is mirrored in the VS Code extension).
    // Unbound copy splits on `awaiting`: cold start (the connector hasn't answered yet) reads "Looking for…" and
    // resolves on the first probe; after that it's a known empty state and the onboarding prompt applies. Reused
    // across the three sections so they say the same thing.
    const awaitingNote = `<div class="note"><svg class="ico spin"><use href="#i-refresh"/></svg>Looking for open PLC projects…</div>`
    const unboundNote = s.awaiting ? awaitingNote : `<div class="note">No workspace open — open one from IDE Connection above.</div>`
    // Every empty state can also just OPEN an existing workspace. Without it the only offer is "create a new one",
    // which strands a user whose workspace already exists on disk (a reinstall, a clone, a second machine).
    const openExisting = `<div class="init-row">` +
      btn("openWorkspace", "btn", "doOpenWorkspace()", `<svg class="ico"><use href="#i-folder"/></svg>`, "Open an existing Volt workspace…", "Pick a folder that was already set up with Volt.") + `</div>`
    // The "no active Volt workspace" body — offer to CREATE one from a detected IDE project, else guide based on WHY
    // nothing's detected. ONE decision, shared by the unbound state and the bound-but-uninitialized state.
    const emptyStateBody = () =>
      s.awaiting ? awaitingNote
      : (s.onboarding === "choose-project" ? createSurface(s.surface)
        : s.onboarding === "no-connector" ? `<div class="note">The Volt Connector isn't running — start it from the Start Menu so it can find your open PLC projects.</div>`
        : `<div class="note">No PLC project detected — open one in your IDE (or start it from the Volt Connector), then create a Volt workspace from it here.</div>`) + openExisting
    let bridgeBody
    if (!s.bound) bridgeBody = emptyStateBody()
    // Bound to a folder that isn't a Volt workspace yet: same create/onboarding body as unbound. No folder row — the
    // open folder isn't the subject here (nothing acts on it), and it pushed the actual CTA down the panel.
    else if (!s.initialized) bridgeBody = busy ? "" : emptyStateBody()
    else {
      // Bound Volt workspace — ONE identity: the project name (canonical, what the IDE shows), a health dot, and the
      // connection caption; the workspace folder path lives in the tooltip. A reconcile hint shows ONLY if the folder
      // name diverged from the project (a rename + rebind) — otherwise one name (init names the folder after the project).
      const h = s.health || { label: "…", tone: "warn", online: false }
      const a = s.affordance || { caption: h.online ? "connected" : "not connected", action: h.online ? "disconnect" : "connect" }
      // A connect/disconnect/rebind is fast; surface its label in the PERSISTENT status row so the feedback is
      // visible even after the button flips away on completion (the min-visible-duration in onProgress holds it).
      const cxBusy = busyAction === "connect" || busyAction === "disconnect" || (busyAction || "").startsWith("rebind:")
      const folder = base(s.workspaceRoot || "")
      const name = s.boundProjectName || folder || "—"
      const idRow = `<div class="row"><span class="dot ${h.tone}"></span><span class="path" style="flex:1" title="${esc(s.workspaceRoot || "")}">${esc(name)}</span><span class="n">${cxBusy ? esc(busy) : esc(a.caption)}</span></div>`
      const reconcile = (s.boundProjectName && folder && s.boundProjectName !== folder)
        ? `<div class="note"><svg class="ico ico--muted"><use href="#i-folder"/></svg>Folder “${esc(folder)}” · IDE project “${esc(s.boundProjectName)}” — the binding already matches them; rename the folder to match if you like.</div>`
        : ""
      let actions
      if (a.action === "disconnect") {
        actions = `<div class="init-row">` + btn("disconnect", "btn", "doDisconnect()", `<svg class="ico"><use href="#i-disconnect"/></svg>`, "Disconnect from the IDE", "Stops syncing. The IDE stays open — reconnect to resume.") + `</div>`
      } else {
        const hasProjects = s.surface.primary.length + s.surface.alternates.length > 0
        actions = hasProjects
          ? reconnectSurface(s.surface)
          : `<div class="note">No project detected — open it in the IDE (or start the Volt Connector) to reconnect.</div>`
      }
      bridgeBody = idRow + reconcile + actions
    }
    // No refresh here — the IDE Sync section's refresh re-probes the WHOLE status (health included), so a second
    // button in this section was redundant (VS Code's Bridge view has none either).
    const bridgeActs = ""

    // 2. IDE Sync — driven by the shared `mode` (the same field the VS Code extension switches on). pull/push/build
    // appear ONLY in `ready`; refresh is always available (it re-probes, never mutates). No connect/init here — the
    // states that would need them defer to IDE Connection above.
    // The destructive force actions live in an overflow "⋯" menu (moreMenu), not the primary row — same as VS Code.
    // They still confirm before running (doForcePull/doForcePush).
    const moreMenu =
      `<span class="more"><button class="ico-btn more-btn" title="More actions" onclick="toggleMore(event)">⋯</button>` +
      `<div class="menu${moreOpen ? " open" : ""}">` +
      `<button onclick="closeMoreThen(doForcePull)">Force pull — discard local edits, take the IDE's state</button>` +
      `<button onclick="closeMoreThen(doForcePush)">Force push — overwrite the IDE with your workspace</button>` +
      `</div></span>`
    const syncActs = s.initialized
      ? (s.mode === "ready"
          ? icoBtn("i-pull", "Pull · IDE → workspace", "doPull()", "pull") +
            icoBtn("i-push", "Push · workspace → IDE", "doPush()", "push") +
            icoBtn("i-build", "Build", "doBuild()", "build")
          : "") + refreshBtn("Refresh") + (s.mode === "ready" ? moreMenu : "")
      : ""
    let syncBody
    if (!s.bound) syncBody = unboundNote
    else if (!s.initialized) syncBody = `<div class="note">This folder isn't syncing with an IDE yet — set it up in IDE Connection above.</div>`
    else if (s.mode === "offline") syncBody = `<div class="note">Not connected to the IDE, so there's nothing to compare against. Connect from IDE Connection above.</div>`
    else if (s.mode === "merging") {
      // Per-file conflict resolution: click the name to diff, or take a whole side. Reads the shared `conflicts`
      // list (same one the VS Code merge subtree renders). Buttons/rows go through the delegated panel listener.
      const cf = s.conflicts || []
      const clist = cf.length
        ? `<div class="grp">Conflicts<span class="n">${cf.length}</span></div><div class="scroll" data-scroll="merge">` +
          cf.map((c) => `<div class="row conflict"><span class="stat D">!</span><span class="path click" data-root="${esc(s.workspaceRoot)}" data-path="${esc(c.relPath)}" data-name="${esc(c.name)}" data-dir="incoming" title="Open diff">${esc(c.name)}</span><span class="s-acts"><button class="mini take" data-path="${esc(c.relPath)}" data-side="ide" title="Take the IDE's version">IDE</button><button class="mini take" data-path="${esc(c.relPath)}" data-side="mine" title="Take your version">Mine</button></span></div>`).join("") +
          `</div>`
        : ""
      syncBody = busyNote +
        `<div class="note"><svg class="bolt"><use href="#bolt"/></svg>Merge in progress — resolve each conflict (open the diff, take a side), then finish.</div>` +
        clist +
        `<div class="init-row">` +
        btn("finishMerge", "btn primary", "doFinishMerge()", "", "Finish merge", "Stages your resolutions and advances the IDE baseline.") +
        btn("abortMerge", "btn", "doAbortMerge()", "", "Abort merge", "Restores the workspace to before the pull.") +
        `</div>`
    }
    // The IDE was edited but not yet walked (that walk freezes the IDE, so it's on-demand) — hint a Refresh. The
    // section's Refresh button (syncActs, above) is the action; a full refresh clears this. Shown above the possibly-
    // stale incoming/in-sync rows so they read as "as of the last check".
    else {
      const changedNote = s.ideChanged
        ? `<div class="note"><svg class="ico"><use href="#i-refresh"/></svg>The IDE project was edited — Refresh (above) to check for incoming updates.</div>`
        : ""
      if (n === 0) syncBody = busyNote + changedNote + `<div class="note">✓ In sync with the IDE.</div>` // ready + no drift
      else syncBody = busyNote + changedNote + `<div class="scroll" data-scroll="sync">` +
        changeGrp("Incoming · IDE → pull", s.incoming, "incoming", s.workspaceRoot) +
        changeGrp("Outgoing · push → IDE", s.outgoing, "outgoing", s.workspaceRoot) + `</div>`
    }

    // 3. Diagnostics — gated on `initialized`: a non-Volt folder has nothing to analyze, and `diag` still holds the
    // PREVIOUS project's result (runDiagnostics returns without a new frame), so it must not render here.
    const diagActs = s.initialized ? icoBtn("i-refresh", "Re-analyze", "doRefreshDiag()") : ""
    let diagBody
    if (!s.bound) diagBody = s.awaiting ? `<div class="note">Looking for open PLC projects…</div>` : `<div class="note">No workspace open.</div>`
    else if (!s.initialized) diagBody = `<div class="note">This folder isn't a Volt workspace yet — set it up in IDE Connection above.</div>`
    else if (!diag || diag.loading) diagBody = `<div class="note">Analyzing Structured Text…</div>`
    else if (diag.error) diagBody = `<div class="note"><svg class="bolt"><use href="#bolt"/></svg>${esc(diag.error)}</div>`
    else if ((diag.errors + diag.warnings) === 0) diagBody = `<div class="note">✓ No problems.</div>`
    else
      diagBody =
        `<div class="grp">${diag.errors} error${diag.errors === 1 ? "" : "s"}, ${diag.warnings} warning${diag.warnings === 1 ? "" : "s"}</div><div class="scroll" data-scroll="diag">` +
        diag.files.map((f) => `<div class="row click" data-openpath="${esc(f.path)}" title="Open file"><span class="path">${esc(base(f.path))}</span><span class="n">${f.errors ? `${f.errors}⛔ ` : ""}${f.warnings ? `${f.warnings}⚠` : ""}</span></div>`).join("") + `</div>`

    // Rebuilding innerHTML resets every scroll container to top. render() runs on each status poll (~4s), so
    // without this the list snaps back to top mid-scroll — and a click that lands after the snap opens the WRONG
    // row's diff. Capture each scroll offset by key, rebuild, then restore (panel itself + the per-section boxes).
    const panel = document.getElementById("panel")
    const panelY = panel.scrollTop
    const scrollY = {}
    panel.querySelectorAll("[data-scroll]").forEach((el) => (scrollY[el.dataset.scroll] = el.scrollTop))
    panel.innerHTML = `<div class="inner">` +
      section("bridge", "IDE Connection", bridgeActs, bridgeBody) +
      section("sync", "IDE Sync", syncActs, syncBody) +
      section("diag", "Diagnostics", diagActs, diagBody) +
      `</div>`
    panel.scrollTop = panelY
    panel.querySelectorAll("[data-scroll]").forEach((el) => { const y = scrollY[el.dataset.scroll]; if (y) el.scrollTop = y })
  }

  // A rail tab: jump to its section (and expand it if the user had folded it away).
  function tab(name) {
    activeTab = name
    collapsed.delete(name) // jumping to a section always expands it — you clicked it to see it
    render()
    document.getElementById("sect-" + name)?.scrollIntoView({ block: "start", behavior: "smooth" })
  }

  // Fold/unfold a section's body. Keyed by the section id ("bridge"/"sync"/"diag"); persists across re-renders.
  function toggleSect(key) { collapsed.has(key) ? collapsed.delete(key) : collapsed.add(key); render() }

  // Start an action: set its label and CLEAR any leftover % so the titlebar bar doesn't flash the prior run's fill
  // before the first progress frame arrives. The main process surfaces errors + clears progress itself (runGuarded).
  let busyStart = 0
  const RESULT_MS = 2500 // how long a finished action's result message stays in the progress line before clearing
  function begin(label, key) { busy = label; busyAction = key ?? null; busyPct = null; busyTone = null; busyStart = Date.now(); render() }
  async function doPull() { begin("Pulling…", "pull"); await volt.pull() }
  async function doPush() { begin("Pushing…", "push"); await volt.push() }
  async function doBuild() { begin("Building…", "build"); await volt.build() }
  async function doConnect() { begin("Connecting…", "connect"); await volt.connect() }
  async function doDisconnect() { begin("Disconnecting…", "disconnect"); await volt.disconnect() }
  async function doRebind(projectId, name) {
    if (!confirm(`Re-point this workspace to “${name}”?\n\nOnly the binding changes — your files, git history and the folder name are untouched. Pull afterward to bring in “${name}”'s code.`)) return
    begin("Re-binding…", "rebind:" + projectId); await volt.rebind(projectId)
  }
  async function doForcePull() { if (!confirm("Force pull discards your local workspace edits and overwrites them with the IDE's state.\n\nThis cannot be undone.")) return; begin("Force pulling…", "pull"); await volt.forcePull() }
  async function doForcePush() { if (!confirm("Force push overwrites the IDE with your workspace, ignoring changes made since your last pull.\n\nThis cannot be undone.")) return; begin("Force pushing…", "push"); await volt.forcePush() }
  async function doFinishMerge() { begin("Finishing merge…", "finishMerge"); await volt.finishMerge() }
  async function doAbortMerge() { if (!confirm("Abort discards this merge and restores your workspace to before the pull.\n\nYour in-merge edits are lost. This cannot be undone.")) return; begin("Aborting merge…", "abortMerge"); await volt.abortMerge() }
  function doRefresh() { refreshing = true; render(); volt.refresh() }
  function doRefreshDiag() { diag = { loading: true }; render(); volt.refreshDiagnostics() }
  async function doInit(projectId) { begin("Initializing…", "init:" + projectId); await volt.initWorkspace(projectId) }
  async function doOpenWorkspace() { await volt.openWorkspace() }
  function doDiff(root, path, name, dir) { volt.diff(root, path, name, dir) }
  function doTakeSide(path, side) { volt.mergeResolve(path, side) }

  // The "⋯" overflow menu: toggle stops propagation so opening doesn't immediately hit the outside-click closer;
  // any other click closes it. A menu item closes first, then runs its (confirming) force action.
  function toggleMore(e) { e.stopPropagation(); moreOpen = !moreOpen; render() }
  function closeMoreThen(fn) { moreOpen = false; render(); fn() }
  document.addEventListener("click", () => { if (moreOpen) { moreOpen = false; render() } })
  // One delegated listener on the panel (which persists across re-renders) opens a diff for any clicked change row.
  document.getElementById("panel").addEventListener("click", (e) => {
    const take = e.target.closest(".take")
    if (take) return doTakeSide(take.dataset.path, take.dataset.side)
    const openF = e.target.closest("[data-openpath]") // a Diagnostics file row → open it in the OS editor
    if (openF) return volt.openFile(openF.dataset.openpath)
    const row = e.target.closest("[data-dir]") // a change row or a conflict name → open its diff
    if (row) doDiff(row.dataset.root, row.dataset.path, row.dataset.name, row.dataset.dir)
  })

  // Live progress from any action (main sends formatProgress's {pct,message}); null clears it. The TEXT is the file
  // counter ("1234/8000 · Writing") — preferred over a bare %; busyPct drives the silent titlebar bar for the visual.
  volt.onProgress((p) => {
    if (!p) {
      // Action finished. Hold the busy state for a MINIMUM ~500ms so a fast action (connect/disconnect) still shows
      // visible feedback instead of a sub-frame flash. Guard on busyStart so a NEW action isn't cleared by a stale
      // delayed clear.
      if (busyTone != null) return // a result frame owns the line — its own timer clears it, not runGuarded's null
      const start = busyStart
      setTimeout(() => {
        if (busyStart !== start) return
        busy = null; busyAction = null; busyPct = null; render()
      }, Math.max(0, 500 - (Date.now() - start)))
      return
    }
    if (p.done) {
      // The action's RESULT, shown where the user is already looking (see commands.ts `finish`). Buttons unlock at
      // once (busyAction null) — only the message lingers. A SUCCESS clears itself; an ERROR does not: it's the
      // actionable one ("open it in your IDE, then reconnect"), and a message that deletes itself after 2.5s leaves
      // no trace anywhere in the UI. It stays until the next action begins (`begin` resets the tone).
      busy = p.message; busyTone = p.tone ?? "info"; busyAction = null; busyPct = null
      const start = (busyStart = Date.now())
      if (busyTone !== "error")
        setTimeout(() => {
          if (busyStart !== start) return
          busy = null; busyTone = null; render()
        }, RESULT_MS)
      render()
      return
    }
    busy = p.message ?? "Working…"
    busyPct = p.pct != null ? p.pct : null
    render()
  })
  // Skip the re-render when a poll brings nothing new — the 4s health poll fires onStatus every time, and each
  // render rebuilds the panel (a scroll-resetting churn the user never asked for). Re-render only on a real change
  // (or when a refresh just completed, to un-spin its button).
  volt.onStatus((s) => {
    const changed = refreshing || JSON.stringify(s) !== JSON.stringify(snap)
    snap = s
    refreshing = false
    if (changed) render()
  })
  volt.onDiagnostics((d) => { diag = d; render() })
  render()
</script>
