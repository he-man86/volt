openapi: "3.1.0"
info:
  title: Volt Bridge Protocol
  version: "2.0.0"
  description: |
    Vendor-agnostic HTTP contract for IDE bridges (Beckhoff TwinCAT, CODESYS, TIA, etc.).
    Every bridge MUST satisfy this spec — identical routes, request/response shapes,
    status codes, and error formats. The client should not be able to determine which
    bridge implementation it is talking to from the wire behavior alone.

    Protocol model: git-inspired refs + atomic batched push.

    - GET  /health → liveness + stable identifiers for workspace binding
    - GET  /refs   → project + per-item content versions (cheap, no payload)
    - POST /fetch  → items that changed since client's known versions
    - POST /push   → atomic batch with per-item ifVersion guards
    - POST /build  → IDE build + diagnostics

servers:
  - url: "http://127.0.0.1:8555"
    description: Beckhoff/TwinCAT bridge (default)
  - url: "http://127.0.0.1:8556"
    description: CODESYS bridge

paths:
  # ── /health ───────────────────────────────────────────────────────────────
  /health:
    get:
      operationId: getHealth
      summary: Bridge liveness + cached IDE state
      description: |
        PURE CACHE READ. Never blocks on the IDE thread. Returns cached IDE state
        with stale-while-revalidate semantics — triggers a background probe when
        the cache exceeds 5 seconds of age.

        Used by the agent for workspace binding (platform, projectName, plcProjectName)
        and connection health monitoring.
      responses:
        "200":
          description: Bridge state (may be healthy, degraded, or unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  summary: Healthy bridge with live IDE
                  value:
                    status: "healthy"
                    platform: "beckhoff"
                    platformVariant: null
                    connected: true
                    ideAlive: true
                    degraded: false
                    degradedReason: null
                    ideName: "TcXaeShell"
                    ideVersion: "3.5.21.40"
                    version: "1.0.0"
                    projectName: "MyProject"
                    plcProjectName: "MyPlcProject"
                    projectDirty: false
                unavailable:
                  summary: Bridge running but no IDE attached
                  value:
                    status: "unavailable"
                    platform: "codesys"
                    platformVariant: null
                    connected: false
                    ideAlive: false
                    degraded: false
                    degradedReason: null
                    ideName: null
                    ideVersion: null
                    version: "1.0.0"
                    projectName: null
                    plcProjectName: null

  # ── /refs ─────────────────────────────────────────────────────────────────
  /instances:
    get:
      operationId: listInstances
      summary: Attachable IDE instances/projects (for the connector's picker)
      description: |
        Lists the IDE instances + projects this bridge could attach to. TwinCAT
        enumerates the COM Running Object Table (every running TcXaeShell / VS
        instance and its PLC projects); adapters without multi-instance support
        return an empty list. Works even when the bridge is degraded so a target
        can be re-picked. The connector reads this over HTTP — it does no COM.
      responses:
        "200":
          description: Running instances
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      type: object
                      properties:
                        instanceId: { type: string, description: ROT moniker (incl. pid) — the target id }
                        ideName: { type: string, nullable: true }
                        ideVersion: { type: string, nullable: true }
                        solution: { type: string, nullable: true }
                        projects:
                          type: array
                          items:
                            type: object
                            properties:
                              project: { type: string }
                              plcProjects: { type: array, items: { type: string } }
              example:
                instances:
                  - instanceId: "!TcXaeShell.DTE.15.0:12345"
                    ideName: "TcXaeShell"
                    ideVersion: "15.0"
                    solution: "C:\\proj\\MachineA.sln"
                    projects:
                      - project: "MachineA"
                        plcProjects: ["PLC1", "PLC2"]

  /refs:
    get:
      operationId: getRefs
      summary: Project reference map — per-item versions
      description: |
        Read-only snapshot of every top-level CRUD item with content fingerprints.
        Uses the single shared project-tree walker (same as /fetch and /push).

        - projectVersion: SHA1 of sorted (name → version) map — changes on ANY edit
        - structureVersion: SHA1 of sorted names only — stable across content edits
        - items: one entry per item — { name, folder, version } (no source payload)
      responses:
        "200":
          description: Current project reference map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefsResponse"
              example:
                projectVersion: "a1b2c3d4e5f6a7b8"
                structureVersion: "9f8e7d6c5b4a3210"
                items:
                  - name: "PLC_PRG.st"
                    folder: ""
                    version: "a1b2c3d4e5f60001"
                  - name: "FB_Motor.st"
                    folder: "POUs/Motors"
                    version: "a1b2c3d4e5f60002"
                  - name: "GVL_Constants.gvl"
                    folder: ""
                    version: "a1b2c3d4e5f60003"

  # ── /fetch ────────────────────────────────────────────────────────────────
  /fetch:
    post:
      operationId: fetchChanges
      summary: Fetch changed items since client's known versions
      description: |
        Returns only items whose version differs from (or is absent from) the
        client's knownItems map. Each returned item carries the assembled sourceText
        (StAssembler output) — ready to write directly to the workspace.

        Uses the single shared project-tree walker (same as /refs and /push).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchRequest"
            examples:
              fullFetch:
                summary: Client has nothing — fetch everything
                value:
                  knownItems: {}
              incremental:
                summary: Client knows current versions — fetch only changed
                value:
                  knownItems:
                    PLC_PRG: "a1b2c3d4e5f60001"
                    FB_Motor: "a1b2c3d4e5f60002"
              singleItem:
                summary: Allowlist — fetch a single item preview
                value:
                  knownItems: {}
                  onlyItems: ["PLC_PRG"]
      responses:
        "200":
          description: Changed items since client's known versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchResponse"
              example:
                projectVersion: "b2c3d4e5f6a7b8c9"
                structureVersion: "9f8e7d6c5b4a3210"
                changed:
                  - name: "FB_Motor.st"
                    folder: "POUs/Motors"
                    sourceText: "FUNCTION_BLOCK FB_Motor\nVAR\n  speed : INT;\nEND_VAR\n\nspeed := 100;\n"
                    version: "a1b2c3d4e5f60002"
                removed: ["PLC_PRG_OLD"]
                items:
                  PLC_PRG: "a1b2c3d4e5f60001"
                  FB_Motor: "a1b2c3d4e5f60002"
                  GVL_Constants: "a1b2c3d4e5f60003"

  # ── /push ─────────────────────────────────────────────────────────────────
  /push:
    post:
      operationId: pushBatch
      summary: Atomic batch push with optimistic concurrency
      description: |
        Validates ALL ops' ifVersion against pre-batch state, applies in order on success,
        rejects the whole batch on any conflict.

        Two item-level ops:
        - set: the declarative final state of one item — create (ifVersion=null) or
          update/rename/move (ifVersion=string). toName? renames, toFolder? sets/moves the folder,
          sourceText? sets content; each absent field is left unchanged. One `set` expresses
          rename+edit and rename+move atomically (a rename uses the IDE's native rename so call-sites
          are preserved; a move recreates under the same name so name-based references survive).
        - deleteItem: remove item (requires ifVersion match)

        Batch-level guard: expectedProjectVersion must match current /refs.projectVersion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
            examples:
              noop:
                summary: No-op push — validate batch
                value:
                  expectedProjectVersion: "a1b2c3d4e5f6a7b8"
                  ops: []
              createProgram:
                summary: Create a new program
                value:
                  expectedProjectVersion: "a1b2c3d4e5f6a7b8"
                  ops:
                    - op: "set"
                      name: "PLC_NewProgram"
                      toFolder: "POUs"
                      sourceText: "PROGRAM PLC_NewProgram\nVAR\nEND_VAR\n\n"
                      ifVersion: null
              batchEdit:
                summary: Update one item, delete another, rename+move a third — one atomic batch
                value:
                  expectedProjectVersion: "a1b2c3d4e5f6a7b8"
                  ops:
                    - op: "set"
                      name: "FB_Motor"
                      sourceText: "FUNCTION_BLOCK FB_Motor\nVAR\n  speed : INT;\nEND_VAR\n\nspeed := 200;\n"
                      ifVersion: "a1b2c3d4e5f60002"
                    - op: "deleteItem"
                      name: "PLC_PRG_OLD"
                      ifVersion: "a1b2c3d4e5f69999"
                    - op: "set"
                      name: "FB_Pump"
                      toName: "FB_PumpV2"
                      toFolder: "POUs/Drives"
                      ifVersion: "a1b2c3d4e5f60005"
      responses:
        "200":
          description: Batch result — accepted or rejected with conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResponse"
              examples:
                accepted:
                  summary: Batch accepted
                  value:
                    accepted: true
                    newProjectVersion: "c3d4e5f6a7b8c9d0"
                    newItems:
                      PLC_PRG: "a1b2c3d4e5f60001"
                      FB_Motor: "a1b2c3d4e5f60007"
                      PLC_NewProgram: "b2c3d4e5f6a7b8c9"
                rejected:
                  summary: Batch rejected — version conflict
                  value:
                    accepted: false
                    conflicts:
                      - name: "<project>"
                        yourVersion: "deadbeefdeadbeef"
                        currentVersion: "a1b2c3d4e5f6a7b8"
                        reason: "expected project version does not match current project version"
                    currentProjectVersion: "a1b2c3d4e5f6a7b8"

  # ── /build ────────────────────────────────────────────────────────────────
  /build:
    post:
      operationId: buildProject
      summary: Trigger IDE build and return diagnostics
      description: |
        Triggers a full or incremental IDE build. Returns success status, duration,
        and normalized diagnostics.

        Diagnostics are vendor-normalized: every bridge maps its native error format
        to the canonical {severity, message, line, object, section} shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildRequest"
            examples:
              incremental:
                value:
                  buildType: "incremental"
              full:
                value:
                  buildType: "full"
      responses:
        "200":
          description: Build result with diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildResponse"
              example:
                success: true
                duration: 1234
                diagnostics: []
              x-error-example:
                success: false
                duration: 567
                diagnostics:
                  - severity: "error"
                    message: "Identifier 'speed' not defined"
                    line: 5
                    object: "PLC_PRG"
                    section: "impl"

# ── Schemas ─────────────────────────────────────────────────────────────────
components:
  schemas:
    # ── Health ─────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - platform
        - connected
        - ideAlive
        - degraded
        - degradedReason
        - version
      properties:
        status:
          type: string
          enum: ["healthy", "degraded", "unavailable"]
          description: "Three-way connection state"
        platform:
          type: string
          description: "Vendor identifier — 'beckhoff', 'codesys', 'tia', ..."
        platformVariant:
          type: string
          nullable: true
          description: "OEM rebrand variant (Lenze, Schneider, Wago, ...) or null"
        connected:
          type: boolean
          description: "True when the bridge has a live handle to the IDE"
        ideAlive:
          type: boolean
          description: "True when the IDE process is reachable"
        degraded:
          type: boolean
          description: "True when the COM channel has had recent errors but is still responsive"
        degradedReason:
          type: string
          nullable: true
          description: "Human-readable reason for degraded=true; null when not degraded"
        ideName:
          type: string
          nullable: true
          description: "Friendly IDE name (e.g. 'TcXaeShell')"
        ideVersion:
          type: string
          nullable: true
          description: "IDE version string"
        version:
          type: string
          description: "Bridge daemon version"
        projectName:
          type: string
          nullable: true
          description: "Solution-level project name"
        plcProjectName:
          type: string
          nullable: true
          description: "PLC-project-within-solution name"
        projectDirty:
          type: boolean
          description: "True when the IDE has unsaved changes. Optional — absent when unknown."

    # ── Build ──────────────────────────────────────────────────────────
    BuildRequest:
      type: object
      additionalProperties: false
      required:
        - buildType
      properties:
        buildType:
          type: string
          enum: ["incremental", "full"]

    BridgeDiagnostic:
      type: object
      additionalProperties: false
      required:
        - severity
        - message
        - line
        - object
        - section
      properties:
        severity:
          type: string
          enum: ["error", "warning", "info"]
        message:
          type: string
          minLength: 1
        line:
          type: integer
          minimum: 0
          description: "1-based line within the object's section; 0 when IDE didn't supply one"
        object:
          type: string
          nullable: true
          pattern: '^[^.]+(?:\.[^.]+)*$'
          description: "Bare or dotted object name; null for project-level diagnostics"
        section:
          type: string
          enum: ["decl", "impl"]
          nullable: true
          description: "Section of the object — declaration or implementation; null when unknown"

    BuildResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - duration
        - diagnostics
      properties:
        success:
          type: boolean
          description: "True iff the build completed with zero errors"
        duration:
          type: number
          description: "Build wall time in milliseconds"
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/BridgeDiagnostic"

    # ── Refs ───────────────────────────────────────────────────────────
    RefItem:
      type: object
      additionalProperties: false
      required:
        - name
        - folder
        - version
      properties:
        name:
          type: string
          description: "Item name with extension (e.g. PLC_PRG.st, FB_Motor.st, GVL_Constants.gvl)"
        folder:
          type: string
          description: "Slash-joined containing folder; empty string = root"
        version:
          type: string
          description: "Per-item content fingerprint (SHA1 short)"

    RefsResponse:
      type: object
      additionalProperties: false
      required:
        - projectVersion
        - structureVersion
        - items
      properties:
        projectVersion:
          type: string
          description: "SHA1 of sorted (name → itemVersion) map — changes on ANY edit"
        structureVersion:
          type: string
          description: "SHA1 of sorted item names only — stable across content edits"
        items:
          type: array
          items:
            $ref: "#/components/schemas/RefItem"
          description: "One entry per item (name + folder + version) — not two parallel name-keyed maps"

    # ── Common item shapes ─────────────────────────────────────────────

    FetchedItem:
      type: object
      additionalProperties: false
      required:
        - name
        - sourceText
        - version
      properties:
        name:
          type: string
          description: "Item name with file extension (.st, .gvl, .itf, .struct, .enum, .union, .alias, .library, .task, .device, .trace, .imagepool, .textlist, .recipemanager, .visumanager, .visualization, .symbolconfig, .projectinfo, .librarymanager, .uml, .exttypes, .tmc)"
        folder:
          type: string
          description: "Slash-joined containing folder in the project tree; absent/empty = root"
        sourceText:
          type: string
          description: "Complete assembled file content — ready to write verbatim to workspace"
        version:
          type: string
          description: "Per-item version stamp (SHA1 short)"

    # ── Fetch ──────────────────────────────────────────────────────────
    FetchRequest:
      type: object
      additionalProperties: false
      properties:
        knownItems:
          type: object
          additionalProperties:
            type: string
          description: "Client's currently-known {name → version} map. Omit/empty = fetch all."
        onlyItems:
          type: array
          items:
            type: string
          description: "Optional allowlist — skip work for items not in this list"

    FetchResponse:
      type: object
      additionalProperties: false
      required:
        - projectVersion
        - structureVersion
        - changed
        - removed
        - items
      properties:
        projectVersion:
          type: string
          description: "Current project version (same as /refs would return)"
        structureVersion:
          type: string
          description: "Current structure version (same as /refs would return)"
        changed:
          type: array
          items:
            $ref: "#/components/schemas/FetchedItem"
          description: "Items whose version differs from client's known map"
        removed:
          type: array
          items:
            type: string
          description: "Names the client knew about that no longer exist in the IDE"
        items:
          type: object
          additionalProperties:
            type: string
          description: "Full ref map — client can replace its cache wholesale"

    # ── Push ops ───────────────────────────────────────────────────────
    SetItemOp:
      type: object
      additionalProperties: false
      description: |
        Declarative final state of one item. The item currently named `name` ends up as
        `toName ?? name`, in `toFolder ?? (current folder)`, with `sourceText ?? (current content)` —
        each absent field is left unchanged. One op covers create/update/rename/move and any
        combination (rename+edit, rename+move), applied atomically.
      required:
        - op
        - name
        - ifVersion
      properties:
        op:
          type: string
          const: "set"
        name:
          type: string
          description: "The item's current name (or the new name, on create)"
        toName:
          type: string
          description: "Present iff renamed — the new name"
        toFolder:
          type: string
          description: "Folder placement on create, or the new folder on move; absent = folder unchanged"
        sourceText:
          type: string
          description: "Present iff content changed; absent = content unchanged. Required on create."
        ifVersion:
          type: string
          nullable: true
          description: "null = create new; string = update existing (must match current version)"

    DeleteItemOp:
      type: object
      additionalProperties: false
      required:
        - op
        - name
        - ifVersion
      properties:
        op:
          type: string
          const: "deleteItem"
        name:
          type: string
        ifVersion:
          type: string
          description: "Must match current version of the item"

    PushRequest:
      type: object
      additionalProperties: false
      required:
        - ops
      properties:
        ops:
          type: array
          items:
            $ref: "#/components/schemas/PushOp"
        expectedProjectVersion:
          type: string
          description: "Batch-level guard — must match current /refs.projectVersion if set"

    PushOp:
      discriminator:
        propertyName: op
        mapping:
          set: "#/components/schemas/SetItemOp"
          deleteItem: "#/components/schemas/DeleteItemOp"
      oneOf:
        - $ref: "#/components/schemas/SetItemOp"
        - $ref: "#/components/schemas/DeleteItemOp"

    PushConflict:
      type: object
      additionalProperties: false
      required:
        - name
        - reason
      properties:
        name:
          type: string
        yourVersion:
          type: string
          nullable: true
        currentVersion:
          type: string
          nullable: true
        reason:
          type: string
        code:
          type: string
          nullable: true
          description: "Stable diagnostic code for a thrown-op error (e.g. VG_NESTED_EXPR); null for a plain version conflict"
        line:
          type: integer
          nullable: true
          description: "1-based source line within the pushed body, when the diagnostic knows it"

    PushAccepted:
      type: object
      additionalProperties: false
      required:
        - accepted
        - newProjectVersion
        - newItems
      properties:
        accepted:
          type: boolean
          const: true
        newProjectVersion:
          type: string
        newItems:
          type: object
          additionalProperties:
            type: string
          description: "Refreshed ref map — client can adopt as new cache"

    PushRejected:
      type: object
      additionalProperties: false
      required:
        - accepted
        - conflicts
        - currentProjectVersion
      properties:
        accepted:
          type: boolean
          const: false
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/PushConflict"
        currentProjectVersion:
          type: string

    PushResponse:
      discriminator:
        propertyName: accepted
        mapping:
          "true": "#/components/schemas/PushAccepted"
          "false": "#/components/schemas/PushRejected"
      oneOf:
        - $ref: "#/components/schemas/PushAccepted"
        - $ref: "#/components/schemas/PushRejected"

    # ── Error ──────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: "Machine-readable error code"
              enum:
                - "NOT_FOUND"
                - "BAD_REQUEST"
                - "ALREADY_EXISTS"
                - "PLC_DISCONNECTED"
                - "PLC_DEGRADED"
                - "PLC_UI_UNAVAILABLE"
                - "PLC_UNAVAILABLE"
                - "INTERNAL_ERROR"
                - "MALFORMED_RESPONSE"
            message:
              type: string
              description: "Human-readable error description"
      example:
        error:
          code: "NOT_FOUND"
          message: "Item 'PLC_PRG' not found"
