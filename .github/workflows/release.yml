# Cut a Volt desktop release: build the single Inno Setup installer (Volt-win-Setup.exe) and publish it to GitHub
# Releases on he-man86/volt (this repo). The always-running C# connector polls the releases API and self-updates
# by re-running a newer Setup.exe (Updater.cs), so the GitHub release IS the update feed.
#
# WHY THIS EXISTS: releases used to be built + uploaded by hand (`bun volt-scripts/build-installer.ts --upload` on a dev
# box). That is how v0.2.1 shipped without the installer asset — a manual run dropped it. This automates the whole
# cut so every release is consistent and complete, and verifies the installer landed.
#
#   - One installer (Inno Setup) + connector-driven auto-update — so a single windows-latest job, not a per-OS
#     matrix. Volt's PLC tooling (bridges, CODESYS) is Windows-native anyway.
#   - Triggered by a bare-version tag (X.Y.Z — the connector's updater compares it to the installed version; a
#     `v` prefix would break that compare). Cut by tagging dev.
#
# TO CUT A RELEASE: bump packages/volt-desktop/package.json, commit to dev, then tag `X.Y.Z` (bare, matching that
# version) and push the tag. This workflow builds version X.Y.Z and publishes the GitHub release at tag `X.Y.Z`.
#
# Signing: intentionally PARKED — the installer ships unsigned (Windows SmartScreen warns on first run). opencode
# signs via Azure Trusted Signing (see their publish.yml); add an equivalent step here if/when signing is revisited.
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+" # bare semver — the connector's updater compares it to the installed version; e.g. 0.2.2
  workflow_dispatch: {} # manual re-run — uses the current packages/volt-desktop/package.json version

concurrency: release-${{ github.ref }}

permissions:
  contents: write # `gh release create` (build-installer.ts --upload-only) creates/updates the GitHub Release on this repo

jobs:
  release:
    if: github.repository == 'he-man86/volt' # never run from a fork (opencode's publish.yml does the same)
    runs-on: windows-latest # Inno Setup (ISCC), electron-builder, and the C# connector are all Windows-native
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup (ISCC)
        run: choco install innosetup -y --no-progress

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # On a tag push, the tag MUST match the desktop package version — build-installer.ts names the GitHub release
      # from the package version, so a mismatch would publish under a different tag than the one that triggered this.
      - name: Guard — tag matches desktop version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./packages/volt-desktop/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != ${version} (packages/volt-desktop/package.json). Bump the package version to match the tag."
            exit 1
          fi
          echo "releasing ${version}"

      # Volt ships ONE version: volt-desktop is the source of truth, and the .vsix the installer sideloads must
      # carry the same number. They're separate package.json files (the extension also publishes to the
      # Marketplace on its own), so nothing but this keeps them from drifting apart again. Runs on
      # workflow_dispatch too — there's no tag to compare there, but the two packages must still agree.
      - name: Guard — extension version matches the release
        shell: bash
        run: |
          version=$(node -p "require('./packages/volt-desktop/package.json').version")
          ext=$(node -p "require('./packages/volt-vscode/package.json').version")
          if [ "${ext}" != "${version}" ]; then
            echo "::error::volt-vscode ${ext} != volt-desktop ${version}. Volt ships one version — bump both."
            exit 1
          fi
          echo "extension ${ext} matches"

      - name: Build the Volt installer
        run: bun volt-scripts/build-installer.ts

      # Gate: install the freshly-built installer, verify it configured everything, uninstall it, verify a clean
      # revert. A dirty uninstall (leftover env / registry / files / process) fails here and blocks the publish.
      - name: Smoke-test install / uninstall
        run: bun run test:install

      - name: Publish the Volt installer
        run: bun volt-scripts/build-installer.ts --upload-only
        env:
          GH_TOKEN: ${{ github.token }}

      # Guard against the exact v0.2.1 failure: a publish that omits the installer. Fail loudly if Setup.exe (the
      # thing new users download) isn't on the release.
      - name: Verify the installer was published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/volt-desktop/package.json').version")
          assets=$(gh release view "${version}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          echo "published assets:"; echo "$assets"
          echo "$assets" | grep -qx "Volt-win-Setup.exe" || {
            echo "::error::release ${version} is missing Volt-win-Setup.exe — the installer did not publish"
            exit 1
          }
          echo "✓ Volt-win-Setup.exe published on ${version}"
