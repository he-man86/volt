# Volt's BUILD pipeline: ON DEMAND, it publishes a testable installer as a PRERELEASE, versioned
# <maj>.<min>.<commit-count> and tagged, for the DEV channel.
#
# A dev build is worth publishing when someone wants to install one; until then the commit is enough. Dispatch this workflow
# (Actions -> release -> Run workflow) to cut one from the current dev tip. The connector's stable updater ignores prereleases; only
# VOLT_UPDATE_CHANNEL=dev picks them up, so dev builds never reach stable users.
#
# There is NO stable build here and no branches. A RELEASE promotes one of these dev builds to prod — see
# .github/workflows/promote.yml (`bun run release [version]`): it gates that exact build's installer and flips its
# GitHub release prerelease -> latest. Same version, no rebuild, no downgrade.
#
# The ONE version is computed from git (scripts/version.ts) and INJECTED — stamped into every package.json +
# passed as VOLT_VERSION — so no version is hand-maintained across files (the bug this avoids is an artifact
# reading its own stored version instead of the injected one).
#
# Signing: intentionally PARKED — the installer ships unsigned.
name: release

on:
  workflow_dispatch: {} # the only trigger — cut a prerelease from the current dev tip when one is wanted

# Supersede an in-flight build when a newer commit lands on dev.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # gh release create/edit/upload on this repo

jobs:
  release:
    if: github.repository == 'he-man86/volt' # never from a fork
    runs-on: windows-latest # Inno Setup (ISCC), electron-builder, the C# connector — all Windows-native
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the build number is the commit count (version.ts)

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup (ISCC)
        run: choco install innosetup -y --no-progress

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute the one version (git-derived)
        id: v
        shell: bash
        run: bun scripts/version.ts | tee -a "$GITHUB_OUTPUT"

      # Inject the ONE version (<maj>.<min>.<count>) into each package.json, so every artifact carries the build — the
      # extension most of all: a constant version never out-versions an installed build. The installer, the
      # connector and the desktop exe's FileVersion get it via VOLT_VERSION.
      - name: Stamp the version into every package.json
        shell: bash
        run: |
          v='${{ steps.v.outputs.version }}'
          for p in packages/volt-desktop/package.json packages/volt-vscode/package.json; do
            node -e "const fs=require('fs'),p='$p',j=JSON.parse(fs.readFileSync(p));j.version='$v';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          done
          echo "stamped $v (desktop + extension)"

      - name: Build the Volt installer
        env:
          VOLT_VERSION: ${{ steps.v.outputs.version }}
        run: bun scripts/build-installer.ts

      # No install gates here — every dev push builds, and the gates really install on the runner. They run at RELEASE
      # time instead (promote.yml), against the exact build being promoted, so what ships to stable is what was gated.
      - name: Publish (prerelease — the dev channel)
        env:
          GH_TOKEN: ${{ github.token }}
          VOLT_VERSION: ${{ steps.v.outputs.version }}
        run: bun scripts/build-installer.ts --upload-only

      - name: Verify the installer was published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ steps.v.outputs.version }}'
          assets=$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets" | grep -qx "Volt-win-Setup.exe" || {
            echo "::error::release $version is missing Volt-win-Setup.exe — the installer did not publish"
            exit 1
          }
          # The connector runs a downloaded installer only when its SHA-256 equals the asset's `digest` (Updater.cs).
          # GitHub computes it server-side on upload, so nothing is published for it — this proves it is there.
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$version" --jq '.assets[] | select(.name == "Volt-win-Setup.exe") | .digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Volt-win-Setup.exe on $version carries no sha256 digest ('$digest') — every connector would refuse it as an update"
            exit 1
          }
          echo "✓ Volt-win-Setup.exe published on $version ($digest)"
