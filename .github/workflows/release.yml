# Volt's BUILD pipeline: every push to dev publishes a testable installer as a PRERELEASE, versioned
# X.Y.Z.<commit-count> and tagged, for the DEV channel. The connector's stable updater ignores prereleases; only
# VOLT_UPDATE_CHANNEL=dev picks them up, so dev builds never reach stable users.
#
# There is NO stable build here and no branches. A RELEASE promotes one of these dev builds to prod — see
# .github/workflows/promote.yml (`bun run release [version]`): it gates that exact build's installer and flips its
# GitHub release prerelease -> latest. Same 4-part version, no rebuild, no downgrade.
#
# The ONE version is computed from git (scripts/version.ts) and INJECTED — stamped into every package.json +
# passed as VOLT_VERSION — so no version is hand-maintained across files (the bug this avoids is an artifact
# reading its own stored version instead of the injected one).
#
# Signing: intentionally PARKED — the installer ships unsigned.
name: release

on:
  push:
    branches: [dev]
  workflow_dispatch: {} # manual rebuild of the current dev tip's prerelease

# Supersede an in-flight build when a newer commit lands on dev.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # gh release create/edit/upload on this repo

jobs:
  release:
    if: github.repository == 'he-man86/volt' # never from a fork
    runs-on: windows-latest # Inno Setup (ISCC), electron-builder, the C# connector — all Windows-native
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the build number is the commit count (version.ts)

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup (ISCC)
        run: choco install innosetup -y --no-progress

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute the one version (git-derived)
        id: v
        shell: bash
        run: bun scripts/version.ts | tee -a "$GITHUB_OUTPUT"

      # Inject the version into each package.json (vsce rejects a 4-part version, so both get a 3-part one; the
      # installer + connector get the full `version` via VOLT_VERSION). The electron app gets `base`; the EXTENSION
      # gets `vsix` (<maj>.<min>.<count>) so it moves every build — a constant `base` would leave a newer sideloaded
      # build failing to out-version the installed one, so silent-update refreshes and the drift check both no-op.
      - name: Stamp the version into every package.json
        shell: bash
        run: |
          base='${{ steps.v.outputs.base }}'
          vsix='${{ steps.v.outputs.vsix }}'
          node -e "const fs=require('fs'),p='packages/volt-desktop/package.json',j=JSON.parse(fs.readFileSync(p));j.version='$base';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs'),p='packages/volt-vscode/package.json',j=JSON.parse(fs.readFileSync(p));j.version='$vsix';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          echo "stamped base $base (desktop) + vsix $vsix (extension)"

      - name: Build the Volt installer
        env:
          VOLT_VERSION: ${{ steps.v.outputs.version }}
        run: bun scripts/build-installer.ts

      # No install gates here — every dev push builds, and the gates really install on the runner. They run at RELEASE
      # time instead (promote.yml), against the exact build being promoted, so what ships to stable is what was gated.
      - name: Publish (prerelease — the dev channel)
        env:
          GH_TOKEN: ${{ github.token }}
          VOLT_VERSION: ${{ steps.v.outputs.version }}
        run: bun scripts/build-installer.ts --upload-only --prerelease

      - name: Verify the installer was published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ steps.v.outputs.version }}'
          assets=$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets" | grep -qx "Volt-win-Setup.exe" || {
            echo "::error::release $version is missing Volt-win-Setup.exe — the installer did not publish"
            exit 1
          }
          echo "✓ Volt-win-Setup.exe published on $version"
