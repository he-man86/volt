# Volt's ONE publish pipeline (opencode-style: one parameterized workflow, not a stable/dev copy-paste).
#
#   push to dev  → a PRERELEASE, versioned X.Y.Z.<commit-count> (the DEV channel). Every dev push ships a testable
#                  installer. The connector's stable updater ignores prereleases; only VOLT_UPDATE_CHANNEL=dev picks
#                  them up — so dev builds never reach stable users.
#   push a tag   → a STABLE release, versioned as the tag X.Y.Z (the latest release the stable updater tracks).
#
# The ONE version is computed from git (volt-scripts/version.ts) and INJECTED — stamped into every package.json +
# passed as VOLT_VERSION — so no version is hand-maintained across files (sst/opencode#36232 is the bug that
# happens when an artifact reads its own stored version instead of the injected one).
#
# Cut a stable release: `bun run release` (tags the current volt-desktop version on dev + pushes the tag).
# Signing: intentionally PARKED — the installer ships unsigned (opencode signs via Azure Trusted Signing).
name: release

on:
  push:
    branches: [dev]
    tags: ["[0-9]+.[0-9]+.[0-9]+"] # bare semver X.Y.Z — a 4-part dev tag never matches, so it can't re-trigger
  workflow_dispatch: {} # manual stable re-run of the current volt-desktop version

# Supersede an in-flight DEV build when a newer commit lands (ref = refs/heads/dev). A stable build's ref is the
# unique tag, so its group is unique and it is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # gh release create/edit/upload on this repo

jobs:
  release:
    if: github.repository == 'he-man86/volt' # never from a fork
    runs-on: windows-latest # Inno Setup (ISCC), electron-builder, the C# connector — all Windows-native
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the build number is the commit count (version.ts)

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup (ISCC)
        run: choco install innosetup -y --no-progress

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute the one version (git-derived)
        id: v
        shell: bash
        run: bun volt-scripts/version.ts | tee -a "$GITHUB_OUTPUT"

      # Inject the version into each package.json (vsce rejects a 4-part version, so both get a 3-part one; the
      # installer + connector get the full `version` via VOLT_VERSION). The electron app gets `base`; the EXTENSION
      # gets `vsix` (<maj>.<min>.<count>) so it moves every build — a constant `base` would leave a newer sideloaded
      # build failing to out-version the installed one, so silent-update refreshes and the drift check both no-op.
      - name: Stamp the version into every package.json
        shell: bash
        run: |
          base='${{ steps.v.outputs.base }}'
          vsix='${{ steps.v.outputs.vsix }}'
          node -e "const fs=require('fs'),p='packages/volt-desktop/package.json',j=JSON.parse(fs.readFileSync(p));j.version='$base';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs'),p='packages/volt-vscode/package.json',j=JSON.parse(fs.readFileSync(p));j.version='$vsix';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          echo "stamped base $base (desktop) + vsix $vsix (extension)"

      - name: Build the Volt installer
        env:
          VOLT_VERSION: ${{ steps.v.outputs.version }}
        run: bun volt-scripts/build-installer.ts

      # Install → verify → uninstall → verify-clean. Stable only (it really installs on the runner) — dev builds
      # skip it to stay fast, since every dev push runs this workflow.
      - name: Smoke-test install / uninstall
        if: steps.v.outputs.prerelease == 'false'
        run: bun run test:install

      # The LIFECYCLE gate: install → uninstall → install → update → update → uninstall → install → uninstall,
      # asserting every binary's stamped version, no rollback in the setup log, and zero leftovers after each
      # uninstall. test:install above cannot catch what actually shipped, because those failures need an install
      # OVER an existing one — a locked file made Inno abort and roll back silently, leaving bin/volt.exe releases
      # behind the connector. Stable only, same reason as above.
      # NOTE: a CI runner has no editor holding volt-lsp-iec.exe, so this does NOT reproduce the original lock.
      # It gates the layout and the leftovers; the lock case is the LOCAL run (`bun run test:install:lifecycle`
      # with an editor open), which is how that bug was found and must stay part of pre-release checks.
      - name: Install lifecycle (install/uninstall/update x2, version + leftover checks)
        if: steps.v.outputs.prerelease == 'false'
        run: bun run test:install:lifecycle

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VOLT_VERSION: ${{ steps.v.outputs.version }}
        run: bun volt-scripts/build-installer.ts --upload-only ${{ steps.v.outputs.prerelease == 'true' && '--prerelease' || '' }}

      - name: Verify the installer was published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ steps.v.outputs.version }}'
          assets=$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets" | grep -qx "Volt-win-Setup.exe" || {
            echo "::error::release $version is missing Volt-win-Setup.exe — the installer did not publish"
            exit 1
          }
          echo "✓ Volt-win-Setup.exe published on $version"
