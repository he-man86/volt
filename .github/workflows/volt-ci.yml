# Volt CI — typecheck + lint + the key-free integration check on every push/PR.
# Volt is opencode-independent (opencode is a runtime dependency, not a fork), so there is no fork-surface
# guard. Provider-dependent runtime verifiers (verify-lsp / verify-volt-tool) need an installed opencode +
# API keys, so they run locally / on version bumps, not here.
name: volt-ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Typecheck (volt packages + volt-scripts)
        run: |
          bun run --filter='./packages/volt-*' typecheck
          bunx tsgo --noEmit -p volt-scripts/tsconfig.json

      - name: Build binaries (feeds the integration check)
        run: |
          bun run --cwd packages/volt-git build
          bun run --cwd packages/volt-lsp-iec build

      - name: Integration check (config layer + bins + wiring)
        run: bun run volt-scripts/check-volt-integration.ts

      - name: Lint (volt surface)
        run: bunx oxlint packages/volt-git packages/volt-lsp-iec packages/volt-vscode volt-scripts
