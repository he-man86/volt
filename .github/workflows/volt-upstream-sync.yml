# Volt scheduled upstream sync — keeps the fork current with opencode's latest RELEASE automatically.
# Weekly: resolve the newest v<current-major>.* release tag, merge it onto a sync branch, verify (divergence
# vs the tag + typecheck), and open a PR into `volt` if clean. Conflicts → the run fails (GitHub notifies);
# the human reviews + fast-forwards. (Runtime verifiers + the build-output guards need a full local build, so
# `bun volt-scripts/sync.ts` is run locally when landing; CI verifies the key-free surface.)
#
# Tracks opencode's prod-ready *releases* (tags), NOT its moving `dev` trunk — see CLAUDE.md "Syncing upstream".
# Holds at the CURRENT major (the major read from packages/opencode/package.json); a new major is opted into
# locally with `bun volt-scripts/merge-upstream.ts v2.0.0`.
#
# Note: scheduled runs use the workflow file on the repo's DEFAULT branch — keep this in sync there too,
# or trigger manually via "Run workflow".
name: volt-upstream-sync

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: volt
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Merge the latest opencode release tag onto a sync branch
        id: merge
        run: |
          git config user.name  "volt-sync[bot]"
          git config user.email "volt-sync@users.noreply.github.com"
          git remote add upstream https://github.com/anomalyco/opencode.git || true
          git fetch --tags upstream
          OCVER=$(grep -oE '"version":[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"' packages/opencode/package.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          MAJOR=${OCVER%%.*}
          TARGET=$(git ls-remote --tags --refs upstream "v${MAJOR}.*" | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$TARGET" ]; then echo "::error::no v${MAJOR}.* release tag found on upstream"; exit 1; fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          BEHIND=$(git rev-list --count "HEAD..$TARGET")
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" = "0" ]; then echo "Already up to date with $TARGET."; exit 0; fi
          BRANCH="sync/upstream-$TARGET-$(date +%F)"
          git switch -c "$BRANCH"
          if ! git merge --no-edit "$TARGET"; then
            echo "::error::Merge conflicts merging $TARGET — manual sync needed."
            git merge --abort
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Verify (divergence vs the tag + typecheck)
        if: steps.merge.outputs.branch != ''
        run: |
          bun install --frozen-lockfile
          bun run volt-scripts/check-divergence.ts "${{ steps.merge.outputs.target }}"
          bun turbo typecheck --filter='./packages/volt-*'
          bunx tsgo --noEmit -p volt-scripts/tsconfig.json

      - name: Open PR into volt
        if: steps.merge.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "${{ steps.merge.outputs.branch }}"
          gh pr create --base volt --head "${{ steps.merge.outputs.branch }}" \
            --title "sync: opencode ${{ steps.merge.outputs.target }} (${{ steps.merge.outputs.behind }} commits)" \
            --body "Automated sync to opencode release **${{ steps.merge.outputs.target }}**. Divergence (vs the tag) + typecheck passed in CI. Pull locally, run \`bun volt-scripts/sync.ts\` (full signal flow incl. runtime verifiers + the spinner/channel/plugin guards), then fast-forward \`volt\`." \
            || echo "PR may already exist."
