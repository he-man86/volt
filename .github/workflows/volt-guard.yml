# Fork divergence guard (Volt) — enforces "Volt is purely additive: no edits
# to opencode upstream source outside the allowed integration seams" (see
# CLAUDE.md "Fork surface"). Runs the same check as the pre-push hook, but in
# CI with upstream/dev always fetched — so it holds even when a contributor's
# local upstream ref is stale. Fork-owned workflow; upstream never has it.
name: volt-guard

on:
  pull_request:
  push:
    branches:
      - volt
      - dev
      - "sync/**"

jobs:
  divergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so upstream/dev is reachable after fetch

      - name: Fetch upstream opencode
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git || true
          git fetch --no-tags upstream dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Self-test the divergence classifier
        run: bun run volt-scripts/check-divergence.ts --self-test

      - name: Enforce additive-only divergence vs upstream/dev
        run: bun run volt-scripts/check-divergence.ts upstream/dev
