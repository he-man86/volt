# Build gate for the vendored console frontend.
#
# Why this exists: the SolidStart/vite build only ran at DEPLOY time (deploy.yml, on push to dev), so a broken route
# or a bad import passed its PR green and then broke the trunk's deploy. It also can't be caught locally — console/app
# does not build on Windows (a vite:define bug mangles Windows paths into invalid defines) and Windows is the primary
# dev platform, so Linux CI is the ONLY place a console frontend change is compiled before it reaches dev.
#
# Path-filtered like console-symmetry: only runs when console source changes. Needs no secrets — vite.config.ts is
# plain solidStart + nitro (SST Resource is resolved at runtime, not build).
name: console-build

on:
  workflow_dispatch: {} # on-demand
  push:
    branches: [dev]
    paths:
      - "packages/console/**"
  pull_request:
    branches: [dev]
    paths:
      - "packages/console/**"

# Cancel a superseded run when a newer commit lands on the same ref (opencode convention).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build console/app (SolidStart → nitro/cloudflare)
        run: cd packages/console/app && bun run build
