# Test — the console gateway + billing unit tests (offline). Runs from each package dir (repo-root test run is
# guarded off). One concern per workflow (opencode-style).
name: test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Cancel a superseded run when a newer commit lands on the same ref (opencode convention).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Console tests (gateway + billing logic)
        run: |
          (cd packages/console/core && bun test)
          (cd packages/console/app && bun test)
