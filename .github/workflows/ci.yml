# CI — the PR gate. Every check `dev` branch protection requires lives here, and nothing else does.
#
# WHY ONE FILE: these five ran as five workflows that were ~70% identical boilerplate (name/on/concurrency +
# checkout/setup-bun/install), on the belief that a separate workflow was needed for a separate PR check. It
# isn't: a check run is named after the JOB, not the workflow — console-build.yml is named "console-build" but
# its job is `build`, and GitHub reports the check as "build". Same five checks, one set of triggers.
#
# The path-filtered deploy workflow stays separate because it needs its own `on:` paths — that's the
# one thing a job can't override. release.yml is push-to-dev (prerelease) + tag-triggered (stable).
#
# LOAD-BEARING: `dev` protection requires the contexts typecheck / test / lint / integration / volt-cli / openspec.
# Those are the JOB IDs below. Rename one and every PR blocks forever on a check that never reports, until an admin
# updates branch protection to match.
#
# `volt-cli` (the C# toolchain) is the one job on windows-latest — the net48/net8-windows IDE hosts + WinForms
# connector don't build on Linux. It is a required context, so the C# suite gates every PR alongside the rest.
name: ci

on:
  workflow_dispatch: {} # on-demand — lets the gate be proven without waiting for a PR into dev
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Cancel a superseded run when a newer commit lands on the same ref (opencode convention).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: |
          bun run --filter='*' typecheck
          bunx tsgo --noEmit -p volt-scripts/tsconfig.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx oxlint packages/volt-cli packages/volt-control packages/volt-desktop packages/volt-lsp-iec packages/volt-vscode volt-scripts

  # Every Volt package's own unit suite, each run in its package dir (`--filter` sets the cwd, so the repo-root
  # `bun test` guard is never hit). `--filter='*' test` covers volt-lsp-iec + volt-control automatically — add a
  # `test` script to any Volt package and it gates here with zero CI edit. Two deliberate exceptions:
  #   • volt-cli — its bun suite is the live-bridge e2e (`test:e2e`, needs a running IDE), so it has no plain
  #     `test` script; its offline C# tests are the `volt-cli` job below.
  #   • lsp-iec's `test` is the OFFLINE suite (src + conformance); the heavy real-project corpus is `test:corpus`,
  #     a local ratchet (known-incomplete precision work — it DISCOVERS FPs, it doesn't gate).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Volt package suites (lsp-iec offline + control)
        run: bun run --filter='*' test

  # Build the volt binaries, then the key-free wiring check (config layer + bins + wire/product version parity).
  # Key-free ON PURPOSE: this is the half of `bun run compat` that needs neither opencode nor a provider key,
  # which is what lets it gate every PR. Its sibling verify-opencode.ts drives the real binary and can't run here.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # test:ext derives the extension version from the commit COUNT (see version.ts)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build binaries (feeds the wiring check)
        run: |
          bun run --cwd packages/volt-lsp-iec build   # lsp-iec first (dependency order)
          bun run --cwd packages/volt-vscode build     # extension + bundled cli.js/lsp-server.js
      - name: Wiring check (config layer + LSP/tool registration)
        run: bun run volt-scripts/check-wiring.ts
      # The extension-install gate. A Linux runner has no editor, so this checks the half that does not need one —
      # that `bun run package` stamps the GIT-DERIVED version. That is the regression that actually shipped: a
      # constant 0.0.1 can never out-version an installed dev build, so every `--install-extension` silently
      # no-op'd and the editor kept running old code. The editor-side assertions stay a local gate (`bun run
      # test:ext` on Windows), like verify-opencode.
      # NOTE: needs the job's `fetch-depth: 0`. With a shallow clone `git rev-list --count` is 1, so version.ts
      # computes exactly the base (0.0.1) that this gate exists to prove is NOT used, and it passes no matter
      # what. Vacuous gates are worse than none.
      - name: Extension packaging (version is git-derived, not the base)
        run: bun run test:ext

  # The unified C# toolchain (packages/volt-cli). Windows-only: the solution builds the net48 in-proc CODESYS host,
  # the net8-windows TwinCAT worker, and the WinForms connector, none of which compile on Linux. A required context
  # (see the header note) — the C# suite gates every PR.
  volt-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the whole toolchain (all TFMs — CLI, IDE hosts, connector)
        run: dotnet build packages/volt-cli/Volt.Cli.sln -c Release --nologo
      - name: Test — pipe transport + ported sync + black-box + CODESYS multi-instance
        run: dotnet test packages/volt-cli/test/Volt.Cli.Tests/Volt.Cli.Tests.csproj -c Release --nologo
      - name: Test — shared engine (parsing/PLCopen/VG + push/validate incl. delete-idempotency)
        run: dotnet test packages/volt-cli/test/Volt.Engine.Tests/Volt.Engine.Tests.csproj -c Release --nologo
      - name: Test — connector (connection model, discovery source, single-active + disconnect)
        run: dotnet test packages/volt-cli/test/Volt.Cli.Connector.Tests/Volt.Cli.Connector.Tests.csproj -c Release --nologo

  # Desktop boot smoke: launch the built electron app headless (xvfb) in VOLT_SMOKE mode — proves the frameless
  # window + Volt shell.html actually render, which the pure-logic unit suites can't. Electron needs a display +
  # system libs, so it can't ride the `test` job. Non-required (as volt-cli started) until it proves stable here.
  desktop-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Electron system libs + xvfb
        run: |
          bunx --yes playwright install-deps chromium
          sudo apt-get install -y xvfb
      - name: Boot smoke (headless)
        run: xvfb-run -a bun run --cwd packages/volt-desktop test:e2e

  # volt-control ↔ real connector: drive the TS control-plane CLIENT against the ACTUAL C# ControlServer (a scripted
  # harness), proving the cross-language wire agrees for a single IDE and for MULTIPLE instances across vendors — the
  # drift a mocked unit test can't see. Needs both bun (the client) and .NET (the harness), so it can't ride `test`.
  control-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: bun install --frozen-lockfile
      - name: Control-plane e2e (real ControlServer, single + multi-instance)
        run: bun run --cwd packages/volt-control test:e2e

  # Validate the proposals in openspec/changes. NOT path-filtered: it's a required check, and a path-filtered
  # required check blocks PRs that don't touch openspec/ (GitHub waits forever for a check that never reports).
  # It's cheap, so it runs on every PR.
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bunx @fission-ai/openspec@1.4.1 validate --all
