# CI — one job per concern, ADVISORY. Nothing here blocks a push or a merge.
#
# `dev` branch protection requires NO status check (verified against the API: `required_status_checks` is null).
# Only force-pushes and branch deletion are rejected. These jobs inform; a red one is a signal to fix forward.
#
# ONE FILE: a check run is named after the JOB, not the workflow, so one workflow reports one check per job.
#
# The path-filtered deploy workflow stays separate because it needs its own `on:` paths — that's the one thing a
# job can't override. release.yml (a prerelease) and promote.yml (prerelease -> stable) are workflow_dispatch only.
#
# NAMES: keep the job ids stable so the run history stays readable, NOT because anything gates on them.
#
# `volt-cli` (the C# toolchain, every culture) runs on windows-latest — the net48/net10-windows IDE hosts + WinForms
# connector don't build on Linux.
name: ci

on:
  workflow_dispatch: {} # on-demand — lets the gate be proven without waiting for a PR into dev
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Cancel a superseded run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap checks, in ONE job. typecheck, lint and the openspec validation were three jobs that each paid a
  # checkout + setup-bun + `bun install --frozen-lockfile` to do a few seconds of work — three installs for
  # three commands. They share a runner now; the heavier jobs below stay parallel because they have real setup
  # of their own (a Rust toolchain, a full clone, a Windows runner).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # packageManager — the one place the bun version is written
      - run: bun install --frozen-lockfile
      - name: Typecheck (every package + the repo scripts)
        run: |
          bun run --filter='*' typecheck
          bunx tsc --noEmit -p scripts/tsconfig.json
      - name: Lint
        run: bunx oxlint packages/volt-cli packages/volt-control packages/volt-desktop packages/volt-lsp-iec packages/volt-vscode scripts
      # …and every package's OWN lint script, which oxlint is not. volt-lsp-iec's is the LAYERING check — the
      # one that ranks every folder under src/ and fails on an upward import. It was repaired by
      # `consolidate-lsp-structure` (its bug 8: the lint named folders that no longer existed, so src/network
      # had never been checked) and then ran in no gate at all. A repaired guard that nothing invokes is the
      # same as the broken one it replaced.
      - name: Per-package lint (volt-lsp-iec's is the layering check)
        run: bun run --filter='*' lint
      # 12 seconds, and a change committed without a spec delta is worth hearing about on the commit that adds
      # it rather than weeks later.
      - name: OpenSpec proposals validate
        run: bunx @fission-ai/openspec@1.4.1 validate --all

  # Every Volt package's own unit suite, each run in its package dir (`--filter` sets the cwd, so the repo-root
  # `bun test` guard is never hit). `--filter='*' test` covers volt-lsp-iec + volt-control automatically — add a
  # `test` script to any Volt package and it gates here with zero CI edit. Two deliberate exceptions:
  #   • volt-cli — its `test` script is the small OFFLINE bun suite (`test/unit`, no bridge: currently the
  #     operand-survival oracle's own self-check, which used to sit inside the e2e tier and therefore never
  #     ran here). Its LIVE-bridge suite is `test:e2e` and needs a running IDE, so it stays out of CI; its
  #     offline C# tests are the `volt-cli` job below.
  #   • lsp-iec's `test` is the OFFLINE suite (src + conformance); the heavy real-project corpus is `test:corpus`,
  #     a local ratchet (known-incomplete precision work — it DISCOVERS FPs, it doesn't gate).
  #   • the transpiler's EMITTED RUST needs a Rust toolchain. Without one, `transpile.test.ts` and
  #     `emit/rust/emit.test.ts` skip their whole differential half — measured 2026-09-17: 3,627 assertions
  #     with rustc on PATH, 2,423 without, so ~1,200 assertions covering the EMITTER (the actual deliverable)
  #     ran on one engineer's machine and nowhere else. That is why `VOLT_REQUIRE_RUSTC` exists: here a
  #     missing toolchain is an ERROR, not a quiet skip.
  test:
    runs-on: ubuntu-latest
    env:
      VOLT_REQUIRE_RUSTC: "1" # a missing toolchain fails the job instead of silently dropping the emitter suite
      # CI IS ALWAYS COLD: every emitted-Rust build is a real compile, never a hit out of the content-addressed cache
      # (`packages/volt-lsp-iec/test/conformance/support/rustc-cache.ts`) — the cache is a local speed-up, and the
      # one run that must not be able to trust a stale entry is this one.
      VOLT_RUSTC_CACHE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # packageManager — the one place the bun version is written
      # The toolchain is the one `packages/volt-lsp-iec/rust-toolchain.toml` names — NOT `stable`: the fixture map's
      # stored lint rows are clippy's output, and the day's `stable` lints differently from the release they were
      # written with (1.99.0 here vs 1.96.0 there dropped `expr_not_not`'s nonminimal_bool on 2026-10-04).
      # `rustup toolchain install` with no name installs the toolchain file's, components and profile included.
      - name: Rust toolchain (the emitted-Rust differential runs against it; clippy checks the emitted code's QUALITY)
        working-directory: packages/volt-lsp-iec
        run: rustup toolchain install --no-self-update && rustc --version && clippy-driver --version
      - run: bun install --frozen-lockfile
      - name: Volt package suites (lsp-iec offline + control)
        run: bun run --filter='*' test

  # Build the volt binaries, then the wiring check (bins + source-extension parity).
  # Everything here is offline and key-free, which is what lets it run on every push.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # test:ext derives the extension version from the commit COUNT (see version.ts)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # packageManager — the one place the bun version is written
      - run: bun install --frozen-lockfile
      - name: Build binaries (feeds the wiring check)
        run: |
          bun run --cwd packages/volt-lsp-iec build   # lsp-iec first (dependency order)
          bun run --cwd packages/volt-vscode build     # extension + bundled lsp-server.js
      - name: Wiring check (built binaries + source-extension parity)
        run: bun run scripts/check-wiring.ts
      # The extension-install gate. A Linux runner has no editor, so this checks the half that does not need one —
      # that `bun run package` stamps the GIT-DERIVED version. That is the regression that actually shipped: a
      # constant 0.0.1 can never out-version an installed dev build, so every `--install-extension` silently
      # no-op'd and the editor kept running old code. The editor-side assertions stay a local gate (`bun run
      # test:ext` on Windows).
      # NOTE: needs the job's `fetch-depth: 0`. With a shallow clone `git rev-list --count` is 1, so version.ts
      # computes exactly the base (0.0.1) that this gate exists to prove is NOT used, and it passes no matter
      # what. Vacuous gates are worse than none.
      - name: Extension packaging (version is git-derived, not the base)
        run: bun run test:ext

  # The unified C# toolchain (packages/volt-cli) — every C# suite, ONE definition, run once per culture. Windows-only:
  # the solution builds the net48 in-proc CODESYS host, the net10-windows TwinCAT worker, and the WinForms connector,
  # none of which compile on Linux.
  #
  # LOCALE RUNS (openspec environment-dependency-audit 1.1): `machine` is the runner's own culture; the others are the
  # three customers have shown Volt bugs in or run it on — tr-TR (dotless ı: `VAR_INPUT` stopped matching), ru-RU (a
  # TwinCAT customer), de-DE (decimal comma). The suites cover net10 AND net48 — the CODESYS bridge runs in-proc under
  # the IDE's culture. A runner's Windows locale cannot be set per job, so the switch is in-process: VOLT_TEST_CULTURE
  # (unset for `machine`), read when each C# test assembly loads (test/shared/TestCulture.cs); each suite has a sentinel
  # test that fails a run whose culture did not switch.
  volt-cli:
    strategy:
      fail-fast: false
      matrix:
        culture: [machine, tr-TR, ru-RU, de-DE]
    runs-on: windows-latest
    env:
      VOLT_TEST_CULTURE: ${{ matrix.culture != 'machine' && matrix.culture || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The CLI's bundled MinGit (src/Volt.Cli/MinGit.targets fetches + SHA-256-verifies it on a cold cache): keyed by the pin.
      - uses: actions/cache@v4
        with:
          path: packages/volt-cli/.cache/mingit
          key: mingit-${{ hashFiles('packages/volt-cli/src/Volt.Cli/MinGit.targets') }}
      - name: Build the whole toolchain (all TFMs — CLI, IDE hosts, connector)
        run: dotnet build packages/volt-cli/Volt.sln -c Release --nologo
      # Every suite runs even after one fails, so a red cell names every suite it broke.
      - name: Every C# suite (${{ matrix.culture }} culture)
        shell: pwsh
        run: |
          $failed = @()
          foreach ($p in 'Volt.Cli.Tests','Volt.Engine.Tests','Volt.Connector.Tests','Volt.Ide.Twincat.Tests','Volt.Ide.Codesys.Tests','Volt.Contracts.Tests','Volt.Repo.Gates') {
            dotnet test "packages/volt-cli/test/$p/$p.csproj" -c Release --no-build --nologo --blame-hang-timeout 10m
            if ($LASTEXITCODE -ne 0) { $failed += $p }
          }
          if ($failed) { Write-Error "red under the ${{ matrix.culture }} culture: $($failed -join ', ')"; exit 1 }

  # The TS half of the locale runs (see `volt-cli` above): volt-control — the package holding the product TS's one
  # locale-sensitive call (diagnostics.ts) — and the LSP's sentinel only, via the TS preload
  # (volt-lsp-iec/test/support/culture.ts). The LSP's src calls no locale-sensitive API (JS toUpperCase and /i ignore
  # the locale), so a full LSP run per culture could only go red on the sentinel; a NEW locale call anywhere in product
  # TS is the repo gate's (CultureInvariantOperationsTests), not this. The machine culture is the `test` job.
  cultures:
    strategy:
      fail-fast: false
      matrix:
        culture: [tr-TR, ru-RU, de-DE]
    runs-on: ubuntu-latest
    env:
      VOLT_TEST_CULTURE: ${{ matrix.culture }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # packageManager — the one place the bun version is written
      - run: bun install --frozen-lockfile
      - name: volt-control under ${{ matrix.culture }}
        working-directory: packages/volt-control
        run: bun test src
      - name: The LSP's locale sentinel under ${{ matrix.culture }}
        working-directory: packages/volt-lsp-iec
        run: bun test test/support/culture.test.ts

  # volt-control ↔ real connector: drive the TS control-plane CLIENT against the ACTUAL C# ControlServer (a scripted
  # harness), proving the cross-language wire agrees for a single IDE and for MULTIPLE instances across vendors — the
  # drift a mocked unit test can't see. Needs both bun (the client) and .NET (the harness), so it can't ride `test`.
  control-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # packageManager — the one place the bun version is written
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bun install --frozen-lockfile
      - name: Control-plane e2e (real ControlServer, single + multi-instance)
        run: bun run --cwd packages/volt-control test:e2e
