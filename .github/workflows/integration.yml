# Integration — build the volt binaries, then the key-free wiring check (config layer + bins + version parity).
# Volt-specific (opencode has no equivalent); kept as its own concern alongside typecheck/test/lint.
#
# Key-free ON PURPOSE: this is the half of `bun run compat` that needs no opencode and no provider key, which is
# what lets it gate every PR. Its sibling, verify-opencode.ts, drives the real opencode binary and can't run here.
#
# The job name below is a required status check on `dev` — renaming it blocks every PR until branch protection
# is updated to match.
name: integration

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Cancel a superseded run when a newer commit lands on the same ref (opencode convention).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build binaries (feeds the integration check)
        run: |
          bun run --cwd packages/volt-lsp-iec build   # lsp-iec first (dependency order)
          bun run --cwd packages/volt-git build
          bun run --cwd packages/volt-vscode build     # extension + bundled cli.js/lsp-server.js
      - name: Integration check (config layer + bins + wiring)
        run: bun run volt-scripts/check-wiring.ts
