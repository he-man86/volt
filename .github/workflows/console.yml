# Build gate for the vendored console frontend.
#
# console/app does NOT build on Windows (a vite:define path bug), and the primary dev box is Windows, so Linux CI
# is the ONLY place a console change is compiled before it reaches dev's deploy — a broken route/import passes a
# Windows PR green and then breaks the trunk's deploy.
#
# Path-filtered: only runs when console source changes. NOT folded into deploy — this is a PRE-MERGE gate, deploy
# runs post-merge on push. NOT ci — ci can't path-filter a single job, so the console would build on every PR.
name: console

on:
  workflow_dispatch: {} # on-demand
  push:
    branches: [dev]
    paths:
      - "packages/console/**"
  pull_request:
    branches: [dev]
    paths:
      - "packages/console/**"

# Cancel a superseded run when a newer commit lands on the same ref (opencode convention).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build console/app (SolidStart → nitro/cloudflare)
        run: cd packages/console/app && bun run build
