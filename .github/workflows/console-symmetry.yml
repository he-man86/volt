# Structural-symmetry gate for the vendored opencode console.
#
# packages/console/* must stay opencode-verbatim except the DIVERGENCE.md allowlist, so we can keep pulling
# opencode's bugfixes. This fails if any opencode SOURCE file drifts outside that allowlist.
#
# Path-filtered on purpose: it only runs when console source (or the check itself) changes — the only time drift
# can be introduced — so we don't download the opencode tarball on unrelated pushes. Fast: no deps to install.
name: console-symmetry

on:
  workflow_dispatch: {} # on-demand (also lets us prove the gate without a console change)
  push:
    branches: [dev]
    paths:
      - "packages/console/**"
      - "volt-scripts/check-console-divergence.ts"
  pull_request:
    branches: [dev]
    paths:
      - "packages/console/**"
      - "volt-scripts/check-console-divergence.ts"

# Cancel a superseded run when a newer commit lands on the same ref (opencode convention).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  symmetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Console divergence gate (vs pinned opencode)
        run: bun volt-scripts/check-console-divergence.ts
