# Typecheck — tsgo --noEmit across all volt packages + volt-scripts.
#
# One concern per workflow, mirroring opencode — but NOT, as this comment used to claim, because a separate
# workflow is needed for a separate PR check. A check run is named after the JOB, not the workflow: console-build.yml
# is named "console-build" yet its job is `build`, and GitHub reports the check as "build". One workflow with N jobs
# reports the same N checks. What the split actually buys is per-concern triggers (cf. the path-filtered
# console-symmetry) and independent concurrency groups.
#
# LOAD-BEARING: `dev` branch protection requires the contexts typecheck / test / lint / integration / openspec —
# and those are JOB names. Renaming the job below silently blocks every PR until protection is updated to match.
name: typecheck

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Cancel a superseded run when a newer commit lands on the same ref (opencode convention).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: |
          bun run --filter='*' typecheck
          bunx tsgo --noEmit -p volt-scripts/tsconfig.json
