# Promote a dev build to the STABLE channel — the "release" side of Volt's publish pipeline. There are NO branches
# and NO separate stable version: a release is an already-built, already-tested DEV build (0.0.1.<count>, published
# as a prerelease) pointed at prod. This workflow RE-VERIFIES that build (it's a published prerelease AND its
# commit's ci.yml is green), GATES it (downloads ITS OWN installer and runs the install/uninstall/lifecycle checks
# against it), then flips its GitHub release prerelease -> latest. The stable channel updater then serves it.
#
# Trigger: `bun run release [version]` (volt-scripts/release.ts), or the Actions tab → this workflow → Run workflow.
name: promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "the dev build to promote (X.Y.Z.<count>, e.g. 0.0.1.842). Blank args are rejected."
        required: true

# Never promote the same build twice at once; don't cancel a promotion mid-gate.
concurrency:
  group: promote-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write # flip the release: prerelease -> latest
  actions: read # read ci.yml's conclusion for the build's commit

jobs:
  promote:
    if: github.repository == 'he-man86/volt' # never from a fork
    runs-on: windows-latest # the install gates REALLY install on the runner (Windows-only)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + full history — we resolve the build's commit to check its CI

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x" # the installed volt.exe (a .NET CLI) must run inside the install gate

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The build must be a PUBLISHED PRERELEASE and its commit's ci.yml must be GREEN — a release only ever promotes
      # a build that already passed the checks. (A dev build already ran ci.yml on push; this just confirms it.)
      - name: Verify — published prerelease + green CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v='${{ inputs.version }}'
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$v' is not a 4-part build version (X.Y.Z.count)"; exit 1; }
          ispre=$(gh release view "$v" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          [ "$ispre" = "true" ] || { echo "::error::$v is not a published prerelease (already stable, a draft, or missing)"; exit 1; }
          sha=$(git rev-list -n 1 "$v")   # the commit the build's tag points at
          concl=$(gh run list --workflow=ci.yml --commit "$sha" --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
          [ "$concl" = "success" ] || { echo "::error::ci.yml for $sha is '$concl', not success — checks must be green to release"; exit 1; }
          echo "$v (commit $sha) — published prerelease, CI green"

      - name: Download the build's own installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/release
          gh release download '${{ inputs.version }}' --repo "$GITHUB_REPOSITORY" --pattern "Volt-win-Setup.exe" --output dist/release/Volt-win-Setup.exe

      - name: Gate — install / uninstall
        run: bun run test:install

      - name: Gate — install lifecycle (install/uninstall/update x2, version + leftover checks)
        run: bun run test:install:lifecycle

      # Only now: flip the exact build we just gated to the stable channel. --latest makes it what the stable updater
      # (and GitHub's /releases/latest) serves; --prerelease=false takes it out of the dev channel.
      - name: Promote to stable (prerelease -> latest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit '${{ inputs.version }}' --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "✓ ${{ inputs.version }} is now the stable release"
