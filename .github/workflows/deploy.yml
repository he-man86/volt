# Deploy Volt's public site.
#
# Since openspec/changes/sell-cli-subscription this deploys exactly one thing: the static site at
# packages/volt-web. There is no console, no gateway, no database and no secrets to provision — payment, EU
# VAT, licence keys and the customer portal are Polar's.
#
# The only credential needed is a Cloudflare API token: SST creates the Workers site, the custom domain and
# the DNS record.
#
# `action: remove` tears a stage down instead. It exists because SST state is per-runner: the stage CI
# created is not visible from a developer machine (`sst diff` locally answers "Stage not found"), so a
# teardown has to run here or not at all. It is dispatch-only — a push always deploys, because
# `github.event.inputs` is empty outside workflow_dispatch and the fallback is `deploy`.

name: deploy

on:
  push:
    branches: [dev]
    paths:
      - "packages/volt-web/**"
      - "infra/**"
      - "sst.config.ts"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: SST stage
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production
      action:
        description: "deploy, or remove (DESTROYS every resource in the stage)"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - remove

concurrency: deploy-${{ github.event.inputs.stage || 'dev' }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.stage || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bunx sst ${{ github.event.inputs.action || 'deploy' }} --stage ${{ github.event.inputs.stage || 'dev' }} --print-logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
