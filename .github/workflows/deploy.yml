# Deploy the Volt commercial backend (console/app + SST) from CI.
#
# WHY CI: console/app's SolidStart web build fails on Windows (the pinned @solidjs/start preview mangles
# Windows paths — proven: vite build/dev both fail). `sst deploy` runs that build locally, so the deploy
# must run on Linux. This job (ubuntu) is that Linux builder — you stay on Windows.
#
# Mirrors opencode's own deploy.yml, adapted for Volt's *verified* differences:
#   - no AWS step (we removed the aws provider; the infra creates zero AWS resources)
#   - no Sentry (dropped — 0 code refs in opencode)
#   - PLANETSCALE_SERVICE_TOKEN_ID (current/recommended per the Pulumi provider docs), not the
#     deprecated _NAME opencode's older workflow used
#
# PREREQUISITES (not done here — opencode also sets secrets out of band):
#   1. volt-ai.dev must be Active on Cloudflare (custom domains resolve).
#   2. The ~48 SST secrets must already be set for the stage. Generate + load them once (from a host with
#      SST + Cloudflare auth — sst secret load does NOT build the web app, so it is not Windows-blocked):
#        bun volt-scripts/deploy-secrets.ts            # writes .env.deploy from .env
#        bunx sst secret load .env.deploy --stage <stage>
#   3. GitHub environment secrets (per stage — create "dev"/"production" environments):
#        CLOUDFLARE_API_TOKEN, PLANETSCALE_SERVICE_TOKEN, PLANETSCALE_SERVICE_TOKEN_ID,
#        STRIPE_SECRET_KEY, HONEYCOMB_API_KEY
#   (DB migrations run separately — `bun run db:dev migrate` — like opencode; the dev branch also inherits
#    the schema by forking main.)

name: deploy

on:
  # Auto-deploy dev when the DEPLOYED surface changes on dev (opencode-style CD) — "merged = live", no drift.
  # Path-filtered so docs / openspec / other-workflow commits don't fire a pointless (idempotent) redeploy.
  # Kept deliberately broad — every input the deploy actually builds from — so a real change never slips through.
  # (workflow_dispatch below is unaffected by paths: a manual deploy always runs.)
  push:
    branches: [dev]
    paths:
      - "packages/console/**" # the console app + gateway code (the deployed artifact)
      - "infra/**" # SST infra definitions
      - "sst.config.ts" # SST entrypoint
      - "models.json" # gateway model catalog (set-models.ts reads it)
      - "volt-scripts/deploy-secrets.ts" # deploy-time secret provisioning
      - "volt-scripts/set-models.ts" # deploy-time catalog provisioning
      - ".github/workflows/deploy.yml" # the deploy workflow itself
  # Manual for production (or an on-demand dev redeploy).
  workflow_dispatch:
    inputs:
      stage:
        description: SST stage to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production

# Serialize deploys per stage; a push resolves to the dev stage (no input). Not cancel-in-progress — never kill
# an in-flight deploy; queue behind it.
concurrency: deploy-${{ github.event.inputs.stage || 'dev' }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.stage || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: bun install --frozen-lockfile

      # Set the SST secrets IN THIS JOB, before deploy. SST state is per-machine (local + cloud-backed,
      # passphrase-encrypted) — secrets set from a dev laptop are NOT visible to a fresh CI runner (proven:
      # CI saw 0/48). Loading them here guarantees the deploy step below reads them (same runner, same .sst/).
      # deploy-secrets fills each declared secret from process.env (the GitHub secrets below), else a
      # non-empty PLACEHOLDER_UNSET (SST rejects empty). Placeholder'd features stay inert until provisioned.
      - name: Load SST secrets into this run's state
        run: bun volt-scripts/deploy-secrets.ts --apply ${{ github.event.inputs.stage || 'dev' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          # Real values where the GitHub secret exists; anything unset → PLACEHOLDER_UNSET (feature inert).
          # Add these secrets to the environment to make the feature live on the next deploy.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ZEN_SESSION_SECRET: ${{ secrets.ZEN_SESSION_SECRET }}
          # GitHub Actions reserves the GITHUB_ secret-name prefix, so these are stored as GH_* and mapped here.
          GITHUB_CLIENT_ID_CONSOLE: ${{ secrets.GH_CLIENT_ID_CONSOLE }}
          GITHUB_CLIENT_SECRET_CONSOLE: ${{ secrets.GH_CLIENT_SECRET_CONSOLE }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          UpstashRedisRestUrl: ${{ secrets.UpstashRedisRestUrl }}
          UpstashRedisRestToken: ${{ secrets.UpstashRedisRestToken }}
          ZEN_LIMITS: ${{ secrets.ZEN_LIMITS }}

      # Gateway model catalog → ZEN_MODELS1..30. ALWAYS runs — no secret-gated `if:` (GitHub masks secrets in
      # `if` conditions, which silently skipped this). set-models substitutes the provider keys into models.json,
      # or loads an empty-but-valid catalog if they're absent. Runs in-job so the chunks reach the deploy's own
      # state, overriding the placeholders deploy-secrets set above.
      - name: Provision gateway model catalog
        run: bun volt-scripts/set-models.ts --apply ${{ github.event.inputs.stage || 'dev' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - run: bunx sst deploy --stage ${{ github.event.inputs.stage || 'dev' }} --print-logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # The Stripe provider (pulumi-stripe) is a community plugin fetched from GitHub releases. Unauthenticated
          # downloads hit GitHub's 60/hr/IP limit on CI (403 rate-limit). The Actions token raises it to 5000/hr.
          GITHUB_TOKEN: ${{ github.token }}
          # Dev-only login allowlist for the auth worker (see infra/console.ts). Empty = open.
          CONSOLE_DEV_EMAILS: ${{ secrets.CONSOLE_DEV_EMAILS }}
          # HONEYCOMB_API_KEY intentionally omitted: setting it activates infra/monitoring.ts, which creates a
          # Honeycomb→Discord alert trigger — and there's no real DISCORD_INCIDENT_WEBHOOK_URL yet. Add it back
          # (re-enabling monitoring) once Discord is provisioned. The monitoring code is in place and ready.
